# The screening proposal task (agent-system §5). Changing the prompt, the
# schema, a model or the effort makes a new task version, which must pass the
# prompt gate (decision 2026-11-05) before it is used.
task_id = "screening"
task_version = "screen-v1"

[defaults]
driver = "anthropic"
model = "claude-opus-5-5"
# Thinking cannot be disabled on Opus 5.5; effort is the control (agent-system §6).
effort = "low"
# Thinking counts toward max_tokens; the answer itself is a few hundred tokens.
max_tokens = 4096

[batch]
# Message Batches for bulk runs (half price, matched by custom_id).
use_batches = true
max_requests_per_batch = 10000

# H-screening-drafts: a candidate version, measured before any use. It is never the
# default (`task_version` above), a product run always loads the default, and only
# `prompt-gate measure --task-version` can load it. Its only change from screen-v1 is
# guidance to answer yes or no when the abstract gives reasonable grounds; the quote
# rule is unchanged. `measured = false` until the researcher has a measurement.
[versions."screen-v2"]
prompt = "prompt-screen-v2.md"
measured = false

[openai_compatible]
# Requests in flight at once when the endpoint has no batch API.
concurrency = 4
