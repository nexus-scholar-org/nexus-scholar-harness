<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Scholar Harness Console</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">NS</div>
      <div>
        <div class="brand-name">Harness Console</div>
        <div class="brand-sub">Phase 5 &middot; Local-First</div>
      </div>
      <span class="live-pill" id="live-pill" title="SSE change tick connected">live</span>
    </div>

    <div class="ws-card">
      <div class="ws-label">Active Workspace</div>
      <div class="ws-slug" id="sidebar-ws">—</div>
    </div>

    <nav id="nav">
      <div class="nav-section">Walk the Phase Trail</div>
      <button class="nav-item active" data-view="dashboard">Dashboard</button>
      <button class="nav-item" data-view="literature">Literature</button>
      <button class="nav-item" data-view="screening">Screening</button>
      <button class="nav-item" data-view="harvest">Harvest &amp; Extract</button>
      <button class="nav-item" data-view="synthesis">Synthesis &amp; Trust</button>
      <button class="nav-item" data-view="graph">Knowledge Graph</button>
      <button class="nav-item" data-view="audit">Audit Trail</button>
      <button class="nav-item" data-view="actions">Agent Exchange</button>
    </nav>

    <div class="sidebar-foot">
      <button class="btn-link" id="reload-btn">Reload now</button>
      <span class="foot-hint">auto-refreshes on focus &amp; file change</span>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div id="view-title">Dashboard</div>
      <div class="topbar-meta" id="view-meta"></div>
    </header>
    <div id="view-err" class="view-err hidden"></div>
    <div id="views">
      <section id="view-dashboard" class="view active" aria-hidden="false"></section>
      <section id="view-literature" class="view" aria-hidden="true"></section>
      <section id="view-screening" class="view" aria-hidden="true"></section>
      <section id="view-harvest" class="view" aria-hidden="true"></section>
      <section id="view-synthesis" class="view" aria-hidden="true"></section>
      <section id="view-graph" class="view" aria-hidden="true"></section>
      <section id="view-audit" class="view" aria-hidden="true"></section>
      <section id="view-actions" class="view" aria-hidden="true"></section>
    </div>
  </main>

  <script src="/static/lib/marked.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
