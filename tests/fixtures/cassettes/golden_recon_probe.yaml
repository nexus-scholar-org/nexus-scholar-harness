        \ <entry>\n    <id>http://arxiv.org/abs/2505.07444v1</id>\n    <title>Lightweight
        Multispectral Crop-Weed Segmentation for Precision Agriculture</title>\n    <updated>2025-05-12T11:08:42Z</updated>\n
        \   <link href=\"https://arxiv.org/abs/2505.07444v1\" rel=\"alternate\" type=\"text/html\"/>\n
        \   <link href=\"https://arxiv.org/pdf/2505.07444v1\" rel=\"related\" type=\"application/pdf\"
        title=\"pdf\"/>\n    <summary>Efficient crop-weed segmentation is critical
        for site-specific weed control in precision agriculture. Conventional CNN-based
        methods struggle to generalize and rely on RGB imagery, limiting performance
        under complex field conditions. To address these challenges, we propose a
        lightweight transformer-CNN hybrid. It processes RGB, Near-Infrared (NIR),
        and Red-Edge (RE) bands using specialized encoders and dynamic modality integration.
        Evaluated on the WeedsGalore dataset, the model achieves a segmentation accuracy
        (mean IoU) of 78.88%, outperforming RGB-only models by 15.8 percentage points.
        With only 8.7 million parameters, the model offers high accuracy, computational
        efficiency, and potential for real-time deployment on Unmanned Aerial Vehicles
        (UAVs) and edge devices, advancing precision weed management.</summary>\n
        \   <category term=\"cs.CV\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <category term=\"cs.RO\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <category term=\"eess.IV\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <published>2025-05-12T11:08:42Z</published>\n    <arxiv:comment>4 pages,
        5 figures, 1 table</arxiv:comment>\n    <arxiv:primary_category term=\"cs.CV\"/>\n
        \   <author>\n      <name>Zeynep Galymzhankyzy</name>\n    </author>\n    <author>\n
        \     <name>Eric Martinson</name>\n    </author>\n  </entry>\n  <entry>\n
        \   <id>http://arxiv.org/abs/2503.20068v1</id>\n    <title>iNatAg: Multi-Class
        Classification Models Enabled by a Large-Scale Benchmark Dataset with 4.7M
        Images of 2,959 Crop and Weed Species</title>\n    <updated>2025-03-25T21:04:42Z</updated>\n
        \   <link href=\"https://arxiv.org/abs/2503.20068v1\" rel=\"alternate\" type=\"text/html\"/>\n
        \   <link href=\"https://arxiv.org/pdf/2503.20068v1\" rel=\"related\" type=\"application/pdf\"
        title=\"pdf\"/>\n    <summary>Accurate identification of crop and weed species
        is critical for precision agriculture and sustainable farming. However, it
        remains a challenging task due to a variety of factors -- a high degree of
        visual similarity among species, environmental variability, and a continued
        lack of large, agriculture-specific image data. We introduce iNatAg, a large-scale
        image dataset which contains over 4.7 million images of 2,959 distinct crop
        and weed species, with precise annotations along the taxonomic hierarchy from
        binary crop/weed labels to specific species labels. Curated from the broader
        iNaturalist database, iNatAg contains data from every continent and accurately
        reflects the variability of natural image captures and environments. Enabled
        by this data, we train benchmark models built upon the Swin Transformer architecture
        and evaluate the impact of various modifications such as the incorporation
        of geospatial data and LoRA finetuning. Our best models achieve state-of-the-art
        performance across all taxonomic classification tasks, achieving 92.38\\%
        on crop and weed classification. Furthermore, the scale of our dataset enables
        us to explore incorrect misclassifications and unlock new analytic possiblities
        for plant species. By combining large-scale species coverage, multi-task labels,
        and geographic diversity, iNatAg provides a new foundation for building robust,
        geolocation-aware agricultural classification systems. We release the iNatAg
        dataset publicly through AgML (https://github.com/Project-AgML/AgML), enabling
        direct access and integration into agricultural machine learning workflows.</summary>\n
        \   <category term=\"cs.CV\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <published>2025-03-25T21:04:42Z</published>\n    <arxiv:primary_category
        term=\"cs.CV\"/>\n    <author>\n      <name>Naitik Jain</name>\n    </author>\n
        \   <author>\n      <name>Amogh Joshi</name>\n    </author>\n    <author>\n
        \     <name>Mason Earles</name>\n    </author>\n  </entry>\n  <entry>\n    <id>http://arxiv.org/abs/2507.01269v1</id>\n
        \   <title>Advancements in Weed Mapping: A Systematic Review</title>\n    <updated>2025-07-02T01:02:52Z</updated>\n
        \   <link href=\"https://arxiv.org/abs/2507.01269v1\" rel=\"alternate\" type=\"text/html\"/>\n
        \   <link href=\"https://arxiv.org/pdf/2507.01269v1\" rel=\"related\" type=\"application/pdf\"
        title=\"pdf\"/>\n    <summary>Weed mapping plays a critical role in precision
        management by providing accurate and timely data on weed distribution, enabling
        targeted control and reduced herbicide use. This minimizes environmental impacts,
        supports sustainable land management, and improves outcomes across agricultural
        and natural environments. Recent advances in weed mapping leverage ground-vehicle
        Red Green Blue (RGB) cameras, satellite and drone-based remote sensing combined
        with sensors such as spectral, Near Infra-Red (NIR), and thermal cameras.
        The resulting data are processed using advanced techniques including big data
        analytics and machine learning, significantly improving the spatial and temporal
        resolution of weed maps and enabling site-specific management decisions. Despite
        a growing body of research in this domain, there is a lack of comprehensive
        literature reviews specifically focused on weed mapping. In particular, the
        absence of a structured analysis spanning the entire mapping pipeline, from
        data acquisition to processing techniques and mapping tools, limits progress
        in the field. This review addresses these gaps by systematically examining
        state-of-the-art methods in data acquisition (sensor and platform technologies),
        data processing (including annotation and modelling), and mapping techniques
        (such as spatiotemporal analysis and decision support tools). Following PRISMA
        guidelines, we critically evaluate and synthesize key findings from the literature
        to provide a holistic understanding of the weed mapping landscape. This review
        serves as a foundational reference to guide future research and support the
        development of efficient, scalable, and sustainable weed management systems.</summary>\n
        \   <category term=\"cs.CV\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <category term=\"eess.IV\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <published>2025-07-02T01:02:52Z</published>\n    <arxiv:primary_category
        term=\"cs.CV\"/>\n    <arxiv:journal_ref>European Journal of Agronomy 175
        (2026): 127992</arxiv:journal_ref>\n    <author>\n      <name>Mohammad Jahanbakht</name>\n
        \   </author>\n    <author>\n      <name>Alex Olsen</name>\n    </author>\n
        \   <author>\n      <name>Ross Marchant</name>\n    </author>\n    <author>\n
        \     <name>Emilie Fillols</name>\n    </author>\n    <author>\n      <name>Mostafa
        Rahimi Azghadi</name>\n    </author>\n    <arxiv:doi>10.1016/j.eja.2026.127992</arxiv:doi>\n
        \   <link rel=\"related\" href=\"https://doi.org/10.1016/j.eja.2026.127992\"
        title=\"doi\"/>\n  </entry>\n  <entry>\n    <id>http://arxiv.org/abs/2310.06582v1</id>\n
        \   <title>Hierarchical Mask2Former: Panoptic Segmentation of Crops, Weeds
        and Leaves</title>\n    <updated>2023-10-10T12:47:31Z</updated>\n    <link
        href=\"https://arxiv.org/abs/2310.06582v1\" rel=\"alternate\" type=\"text/html\"/>\n
        \   <link href=\"https://arxiv.org/pdf/2310.06582v1\" rel=\"related\" type=\"application/pdf\"
        title=\"pdf\"/>\n    <summary>Advancements in machine vision that enable detailed
        inferences to be made from images have the potential to transform many sectors
        including agriculture. Precision agriculture, where data analysis enables
        interventions to be precisely targeted, has many possible applications. Precision
        spraying, for example, can limit the application of herbicide only to weeds,
        or limit the application of fertiliser only to undernourished crops, instead
        of spraying the entire field. The approach promises to maximise yields, whilst
        minimising resource use and harms to the surrounding environment. To this
        end, we propose a hierarchical panoptic segmentation method to simultaneously
        identify indicators of plant growth and locate weeds within an image. We adapt
        Mask2Former, a state-of-the-art architecture for panoptic segmentation, to
        predict crop, weed and leaf masks. We achieve a PQ\u2020 of 75.99. Additionally,
        we explore approaches to make the architecture more compact and therefore
        more suitable for time and compute constrained applications. With our more
        compact architecture, inference is up to 60% faster and the reduction in PQ\u2020
        is less than 1%.</summary>\n    <category term=\"cs.CV\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <published>2023-10-10T12:47:31Z</published>\n    <arxiv:comment>6 pages,
        5 figures, 2 tables, for code, see https://github.com/madeleinedarbyshire/HierarchicalMask2Former</arxiv:comment>\n
        \   <arxiv:primary_category term=\"cs.CV\"/>\n    <author>\n      <name>Madeleine
        Darbyshire</name>\n    </author>\n    <author>\n      <name>Elizabeth Sklar</name>\n
        \   </author>\n    <author>\n      <name>Simon Parsons</name>\n    </author>\n
        \ </entry>\n  <entry>\n    <id>http://arxiv.org/abs/1805.12395v1</id>\n    <title>Deep
        Learning with unsupervised data labeling for weeds detection on UAV images</title>\n
        \   <updated>2018-05-31T09:43:40Z</updated>\n    <link href=\"https://arxiv.org/abs/1805.12395v1\"
        rel=\"alternate\" type=\"text/html\"/>\n    <link href=\"https://arxiv.org/pdf/1805.12395v1\"
        rel=\"related\" type=\"application/pdf\" title=\"pdf\"/>\n    <summary>In
        modern agriculture, usually weeds control consists in spraying herbicides
        all over the agricultural field. This practice involves significant waste
        and cost of herbicide for farmers and environmental pollution. One way to
        reduce the cost and environmental impact is to allocate the right doses of
        herbicide at the right place and at the right time (Precision Agriculture).
        Nowadays, Unmanned Aerial Vehicle (UAV) is becoming an interesting acquisition
        system for weeds localization and management due to its ability to obtain
        the images of the entire agricultural field with a very high spatial resolution
        and at low cost. Despite the important advances in UAV acquisition systems,
        automatic weeds detection remains a challenging problem because of its strong
        similarity with the crops. Recently Deep Learning approach has shown impressive
        results in different complex classification problem. However, this approach
        needs a certain amount of training data but, creating large agricultural datasets
        with pixel-level annotations by expert is an extremely time consuming task.
        In this paper, we propose a novel fully automatic learning method using Convolutional
        Neuronal Networks (CNNs) with unsupervised training dataset collection for
        weeds detection from UAV images. The proposed method consists in three main
        phases. First we automatically detect the crop lines and using them to identify
        the interline weeds. In the second phase, interline weeds are used to constitute
        the training dataset. Finally, we performed CNNs on this dataset to build
        a model able to detect the crop and weeds in the images. The results obtained
        are comparable to the traditional supervised training data labeling. The accuracy
        gaps are 1.5% in the spinach field and 6% in the bean field.</summary>\n    <category
        term=\"cs.CV\" scheme=\"http://arxiv.org/schemas/atom\"/>\n    <published>2018-05-31T09:43:40Z</published>\n
        \   <arxiv:primary_category term=\"cs.CV\"/>\n    <author>\n      <name>M.
        Dian. Bah</name>\n    </author>\n    <author>\n      <name>Adel Hafiane</name>\n
        \   </author>\n    <author>\n      <name>Raphael Canals</name>\n    </author>\n
        \ </entry>\n  <entry>\n    <id>http://arxiv.org/abs/1801.08613v2</id>\n    <title>A
        Rapidly Deployable Classification System using Visual Data for the Application
        of Precision Weed Management</title>\n    <updated>2018-04-26T07:36:23Z</updated>\n
        \   <link href=\"https://arxiv.org/abs/1801.08613v2\" rel=\"alternate\" type=\"text/html\"/>\n
        \   <link href=\"https://arxiv.org/pdf/1801.08613v2\" rel=\"related\" type=\"application/pdf\"
        title=\"pdf\"/>\n    <summary>In this work we demonstrate a rapidly deployable
        weed classification system that uses visual data to enable autonomous precision
        weeding without making prior assumptions about which weed species are present
        in a given field. Previous work in this area relies on having prior knowledge
        of the weed species present in the field. This assumption cannot always hold
        true for every field, and thus limits the use of weed classification systems
        based on this assumption. In this work, we obviate this assumption and introduce
        a rapidly deployable approach able to operate on any field without any weed
        species assumptions prior to deployment. We present a three stage pipeline
        for the implementation of our weed classification system consisting of initial
        field surveillance, offline processing and selective labelling, and automated
        precision weeding. The key characteristic of our approach is the combination
        of plant clustering and selective labelling which is what enables our system
        to operate without prior weed species knowledge. Testing using field data
        we are able to label 12.3 times fewer images than traditional full labelling
        whilst reducing classification accuracy by only 14%.</summary>\n    <category
        term=\"cs.CV\" scheme=\"http://arxiv.org/schemas/atom\"/>\n    <published>2018-01-25T22:00:00Z</published>\n
        \   <arxiv:comment>36 pages, 14 figures, published Computers and Electronics
        in Agriculture Vol. 148</arxiv:comment>\n    <arxiv:primary_category term=\"cs.CV\"/>\n
        \   <arxiv:journal_ref>D. Hall, F. Dayoub, T. Perez, and C. McCool, \"A Rapidly
        Deployable Classification System using Visual Data for the Application of
        Precision Weed Management,\" Computers and Electronics in Agriculture, Vol.
        148, pp. 107-120, May 2018</arxiv:journal_ref>\n    <author>\n      <name>David
        Hall</name>\n    </author>\n    <author>\n      <name>Feras Dayoub</name>\n
        \   </author>\n    <author>\n      <name>Tristan Perez</name>\n    </author>\n
        \   <author>\n      <name>Chris McCool</name>\n    </author>\n    <arxiv:doi>10.1016/j.compag.2018.02.023</arxiv:doi>\n
        \   <link rel=\"related\" href=\"https://doi.org/10.1016/j.compag.2018.02.023\"
        title=\"doi\"/>\n  </entry>\n  <entry>\n    <id>http://arxiv.org/abs/2503.02465v2</id>\n
        \   <title>UAV-VLRR: Vision-Language Informed NMPC for Rapid Response in UAV
        Search and Rescue</title>\n    <updated>2025-05-13T06:49:22Z</updated>\n    <link
        href=\"https://arxiv.org/abs/2503.02465v2\" rel=\"alternate\" type=\"text/html\"/>\n
        \   <link href=\"https://arxiv.org/pdf/2503.02465v2\" rel=\"related\" type=\"application/pdf\"
        title=\"pdf\"/>\n    <summary>Emergency search and rescue (SAR) operations
        often require rapid and precise target identification in complex environments
        where traditional manual drone control is inefficient. In order to address
        these scenarios, a rapid SAR system, UAV-VLRR (Vision-Language-Rapid-Response),
        is developed in this research. This system consists of two aspects: 1) A multimodal
        system which harnesses the power of Visual Language Model (VLM) and the natural
        language processing capabilities of ChatGPT-4o (LLM) for scene interpretation.
        2) A non-linearmodel predictive control (NMPC) with built-in obstacle avoidance
        for rapid response by a drone to fly according to the output of the multimodal
        system. This work aims at improving response times in emergency SAR operations
        by providing a more intuitive and natural approach to the operator to plan
        the SAR mission while allowing the drone to carry out that mission in a rapid
        and safe manner. When tested, our approach was faster on an average by 33.75%
        when compared with an off-the-shelf autopilot and 54.6% when compared with
        a human pilot. Video of UAV-VLRR: https://youtu.be/KJqQGKKt1xY</summary>\n
        \   <category term=\"cs.RO\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <category term=\"eess.SY\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <published>2025-03-04T10:21:58Z</published>\n    <arxiv:comment>UAV-VLRR</arxiv:comment>\n
        \   <arxiv:primary_category term=\"cs.RO\"/>\n    <author>\n      <name>Yasheerah
        Yaqoot</name>\n    </author>\n    <author>\n      <name>Muhammad Ahsan Mustafa</name>\n
        \   </author>\n    <author>\n      <name>Oleg Sautenkov</name>\n    </author>\n
        \   <author>\n      <name>Artem Lykov</name>\n    </author>\n    <author>\n
        \     <name>Valerii Serpiva</name>\n    </author>\n    <author>\n      <name>Dzmitry
        Tsetserukou</name>\n    </author>\n  </entry>\n  <entry>\n    <id>http://arxiv.org/abs/1709.06764v2</id>\n
        \   <title>Real-time Semantic Segmentation of Crop and Weed for Precision
        Agriculture Robots Leveraging Background Knowledge in CNNs</title>\n    <updated>2018-03-02T15:46:48Z</updated>\n
        \   <link href=\"https://arxiv.org/abs/1709.06764v2\" rel=\"alternate\" type=\"text/html\"/>\n
        \   <link href=\"https://arxiv.org/pdf/1709.06764v2\" rel=\"related\" type=\"application/pdf\"
        title=\"pdf\"/>\n    <summary>Precision farming robots, which target to reduce
        the amount of herbicides that need to be brought out in the fields, must have
        the ability to identify crops and weeds in real time to trigger weeding actions.
        In this paper, we address the problem of CNN-based semantic segmentation of
        crop fields separating sugar beet plants, weeds, and background solely based
        on RGB data. We propose a CNN that exploits existing vegetation indexes and
        provides a classification in real time. Furthermore, it can be effectively
        re-trained to so far unseen fields with a comparably small amount of training
        data. We implemented and thoroughly evaluated our system on a real agricultural
        robot operating in different fields in Germany and Switzerland. The results
        show that our system generalizes well, can operate at around 20Hz, and is
        suitable for online operation in the fields.</summary>\n    <category term=\"cs.CV\"
        scheme=\"http://arxiv.org/schemas/atom\"/>\n    <category term=\"cs.RO\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <published>2017-09-20T08:24:18Z</published>\n    <arxiv:comment>Accepted
        for publication at IEEE International Conference on Robotics and Automation
        2018 (ICRA 2018)</arxiv:comment>\n    <arxiv:primary_category term=\"cs.CV\"/>\n
        \   <author>\n      <name>Andres Milioto</name>\n    </author>\n    <author>\n
        \     <name>Philipp Lottes</name>\n    </author>\n    <author>\n      <name>Cyrill
        Stachniss</name>\n    </author>\n  </entry>\n  <entry>\n    <id>http://arxiv.org/abs/1801.00443v2</id>\n
        \   <title>Capacity Characterization of UAV-Enabled Two-User Broadcast Channel</title>\n
        \   <updated>2018-01-06T06:55:00Z</updated>\n    <link href=\"https://arxiv.org/abs/1801.00443v2\"
        rel=\"alternate\" type=\"text/html\"/>\n    <link href=\"https://arxiv.org/pdf/1801.00443v2\"
        rel=\"related\" type=\"application/pdf\" title=\"pdf\"/>\n    <summary>Although
        prior works have exploited the UAV's mobility to enhance the wireless communication
        performance under different setups, the fundamental capacity limits of UAV-enabled/aided
        multiuser communication systems have not yet been characterized. To fill this
        gap, we consider in this paper a UAV-enabled two-user broadcast channel (BC),
        where a UAV flying at a constant altitude is deployed to send independent
        information to two users at different fixed locations on the ground. We aim
        to characterize the capacity region of this new type of BC over a given UAV
        flight duration, by jointly optimizing the UAV's trajectory and transmit power/rate
        allocations over time, subject to the UAV's maximum speed and maximum transmit
        power constraints. First, to draw essential insights, we consider two special
        cases with asymptotically large/low UAV flight duration/speed, respectively.
        For the former case, it is shown that a simple hover-fly-hover (HFH) UAV trajectory
        with time division multiple access (TDMA) based orthogonal multiuser transmission
        is capacity-achieving, while in the latter case, the UAV should hover at a
        fixed location that is nearer to the user with larger achievable rate and
        in general superposition coding (SC) based non-orthogonal transmission with
        interference cancellation at the receiver of the nearer user is required.
        Next, we consider the general case with finite UAV speed and flight duration.
        We show that the optimal UAV trajectory should follow a general HFH structure,
        i.e., the UAV successively hovers at a pair of initial and final locations
        above the line segment of the two users each with a certain amount of time
        and flies unidirectionally between them at the maximum speed, and SC is generally
        needed.</summary>\n    <category term=\"cs.IT\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <category term=\"math.HO\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <category term=\"math.OC\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <published>2018-01-01T13:37:54Z</published>\n    <arxiv:comment>[ UAV-Enabled
        Aerial Base Station (BS) III ] Submitted to IEEE JSAC. This is the third of
        a series of three works (trilogy) that focus on UAV-enabled aerial BS for
        wireless networks.The other two works are \"Common Throughput Maximization
        in UAV-Enabled Multiuser OFDMA Systems with Delay Consideration\" and \"Joint
        Trajectory and Communication Design for Multi-UAV Enabled Wireless Networks\"</arxiv:comment>\n
        \   <arxiv:primary_category term=\"cs.IT\"/>\n    <author>\n      <name>Qingqing
        Wu</name>\n    </author>\n    <author>\n      <name>Jie Xu</name>\n    </author>\n
        \   <author>\n      <name>Rui Zhang</name>\n    </author>\n  </entry>\n  <entry>\n
        \   <id>http://arxiv.org/abs/2607.16193v2</id>\n    <title>UAV-DualCog: A
        Dual-Cognition Benchmark for Grounded UAV Agent-World Reasoning with MLLMs</title>\n
        \   <updated>2026-11-02T15:59:35Z</updated>\n    <link href=\"https://arxiv.org/abs/2607.16193v2\"
        rel=\"alternate\" type=\"text/html\"/>\n    <link href=\"https://arxiv.org/pdf/2607.16193v2\"
        rel=\"related\" type=\"application/pdf\" title=\"pdf\"/>\n    <summary>Multimodal
        large language models (MLLMs) perform strongly across vision-language tasks,
        yet remain insufficiently explored in UAV scenarios. Recent UAV-oriented benchmarks
        have begun to evaluate MLLMs in aerial scenarios, but typically focus on scene
        understanding, event recognition, or navigation completion, rather than jointly
        assessing the dual-cognition capability required for UAV agents: reasoning
        about the UAV's own position, behavior, and observation state alongside external
        landmark states under continuously changing viewpoints, supported by explicit
        spatio-temporal grounding. To address this gap, we present UAV-DualCog, the
        first benchmark to formulate UAV dual cognition as the coordinated evaluation
        of Agent-State Reasoning and World-State Reasoning across multi-view images
        and egocentric videos, with explicit spatial or temporal grounding. The State-aware
        UAV Simulation Platform (SUSP) and the DualCog-aware Capture System (DCCS)
        construct 4,096 image and 2,048 video samples from 12 scenes, pairing complementary
        state questions within shared Agent-Landmark contexts. Extensive evaluations
        on 45 models show that current MLLMs remain far from reliable in UAV dual
        cognition: Agent-State Reasoning is generally weaker than World-State Reasoning,
        semantic answers do not reliably coincide with spatial or temporal grounding,
        and coordinated abilities remain limited. Thinking-mode comparisons, open-ended
        analyses, and sim-to-real validation show that these limitations persist across
        inference settings, formats, and environments. We further construct UAV-DualCog-Train
        and improve UAV dual-cognition performance through a lightweight optimization
        probe. Supplementary website, code, and dataset: https://smartdianlab.github.io/UAV-DualCog/</summary>\n
        \   <category term=\"cs.CV\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <published>2026-07-17T17:59:56Z</published>\n    <arxiv:comment>8 pages,
        4 figures, 6 tables. Project website: https://smartdianlab.github.io/UAV-DualCog/</arxiv:comment>\n
        \   <arxiv:primary_category term=\"cs.CV\"/>\n    <author>\n      <name>Like
        Liu</name>\n    </author>\n    <author>\n      <name>Zhengzheng Xu</name>\n
        \   </author>\n    <author>\n      <name>Hongzhe Li</name>\n    </author>\n
        \   <author>\n      <name>Lin Wang</name>\n    </author>\n    <author>\n      <name>Dian
        Shao</name>\n    </author>\n  </entry>\n  <entry>\n    <id>http://arxiv.org/abs/2606.06709v1</id>\n
        \   <title>USU-Corn-WeedDB: A UAV RGB Image Dataset for Multi-Species Weed
        Detection in Forage Corn</title>\n    <updated>2026-06-04T20:51:41Z</updated>\n
        \   <link href=\"https://arxiv.org/abs/2606.06709v1\" rel=\"alternate\" type=\"text/html\"/>\n
        \   <link href=\"https://arxiv.org/pdf/2606.06709v1\" rel=\"related\" type=\"application/pdf\"
        title=\"pdf\"/>\n    <summary>Weed pressure in forage corn production causes
        yield losses of up to 31.5%, yet site-specific weed management (SSWM) systems
        built on UAV imagery and deep learning remain constrained by the scarcity
        of field-representative training datasets. We present USU-Corn-WeedDB, a publicly
        available UAV RGB image dataset collected from a commercial forage corn field
        in Cache Valley, Utah, designed to support multi-class weed detection under
        both supervised and semi-supervised learning frameworks. RGB imagery was acquired
        on 27 June 2025 using an Autel EVO II Dual 640T V2 drone at ~10m above ground
        level, yielding a ground sampling distance of approximately 0.48 cm/pixel.
        A total of 366 full-resolution images were tiled into 8,800 patches at 640
        x 640-pixel resolution. Of these, 800 images were manually annotated for three
        weed species; common lambsquarters (Chenopodium album), redroot pigweed (Amaranthus
        retroflexus), and green foxtail (Setaria viridis) comprising 10,539 bounding-box
        instances, with the remaining 8,000 tiles retained as an unlabeled pool for
        semi-supervised experiments. This dataset reflects a natural class imbalance
        where redroot pigweed constitutes 53.86% of annotated instances, which was
        preserved intentionally to mirror real field conditions. To validate dataset
        utility, we trained 28 object detection models spanning five architecture
        families including YOLOv8, YOLOv9, YOLOv10, YOLO11, YOLO26, and RT-DETR under
        identical conditions without hyperparameter tuning. Test set mAP@0.5 ranged
        from 0.773 to 0.840, with lightweight models achieving competitive performance
        relevant to edge-deployed UAV systems. USU-Corn-WeedDB is publicly available
        at https://doi.org/10.5281/zenodo.20044178.</summary>\n    <category term=\"cs.CV\"
        scheme=\"http://arxiv.org/schemas/atom\"/>\n    <published>2026-06-04T20:51:41Z</published>\n
        \   <arxiv:comment>8 pages, 4 figures, 1 table</arxiv:comment>\n    <arxiv:primary_category
        term=\"cs.CV\"/>\n    <author>\n      <name>Utsav Bhandari</name>\n    </author>\n
        \   <author>\n      <name>Saroj Burlakoti</name>\n    </author>\n    <author>\n
        \     <name>Rhonda Miller</name>\n    </author>\n    <author>\n      <name>Sierra
        Young</name>\n    </author>\n    <author>\n      <name>Eric Westra</name>\n
        \   </author>\n    <author>\n      <name>Aaron Etienne</name>\n    </author>\n
        \ </entry>\n  <entry>\n    <id>http://arxiv.org/abs/2504.19991v2</id>\n    <title>Mapping
        of Weed Management Methods in Orchards using Sentinel-2 and PlanetScope Data</title>\n
        \   <updated>2025-07-23T12:31:13Z</updated>\n    <link href=\"https://arxiv.org/abs/2504.19991v2\"
        rel=\"alternate\" type=\"text/html\"/>\n    <link href=\"https://arxiv.org/pdf/2504.19991v2\"
        rel=\"related\" type=\"application/pdf\" title=\"pdf\"/>\n    <summary>Effective
        weed management is crucial for improving agricultural productivity, as weeds
        compete with crops for vital resources like nutrients and water. Accurate
        maps of weed management methods are essential for policymakers to assess farmer
        practices, evaluate impacts on vegetation health, biodiversity, and climate,
        as well as ensure compliance with policies and subsidies. However, monitoring
        weed management methods is challenging as they commonly rely on ground-based
        field surveys, which are often costly, time-consuming and subject to delays.
        In order to tackle this problem, we leverage earth observation data and Machine
        Learning (ML). Specifically, we developed separate ML models using Sentinel-2
        and PlanetScope satellite time series data, respectively, to classify four
        distinct weed management methods (Mowing, Tillage, Chemical-spraying, and
        No practice) in orchards. The findings demonstrate the potential of ML-driven
        remote sensing to enhance the efficiency and accuracy of weed management mapping
        in orchards.</summary>\n    <category term=\"cs.CV\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <category term=\"cs.LG\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <published>2025-04-28T17:09:10Z</published>\n    <arxiv:comment>Accepted
        for 2025 IEEE International Geoscience and Remote Sensing Symposium (IGARSS
        2025)</arxiv:comment>\n    <arxiv:primary_category term=\"cs.CV\"/>\n    <author>\n
        \     <name>Ioannis Kontogiorgakis</name>\n    </author>\n    <author>\n      <name>Iason
        Tsardanidis</name>\n    </author>\n    <author>\n      <name>Dimitrios Bormpoudakis</name>\n
        \   </author>\n    <author>\n      <name>Ilias Tsoumas</name>\n    </author>\n
        \   <author>\n      <name>Dimitra A. Loka</name>\n    </author>\n    <author>\n
        \     <name>Christos Noulas</name>\n    </author>\n    <author>\n      <name>Alexandros
        Tsitouras</name>\n    </author>\n    <author>\n      <name>Charalampos Kontoes</name>\n
        \   </author>\n    <arxiv:doi>10.1109/IGARSS55030.2025.11243099</arxiv:doi>\n
        \   <link rel=\"related\" href=\"https://doi.org/10.1109/IGARSS55030.2025.11243099\"
        title=\"doi\"/>\n  </entry>\n  <entry>\n    <id>http://arxiv.org/abs/2502.06255v1</id>\n
        \   <title>Towards Efficient and Intelligent Laser Weeding: Method and Dataset
        for Weed Stem Detection</title>\n    <updated>2025-02-10T08:42:46Z</updated>\n
        \   <link href=\"https://arxiv.org/abs/2502.06255v1\" rel=\"alternate\" type=\"text/html\"/>\n
        \   <link href=\"https://arxiv.org/pdf/2502.06255v1\" rel=\"related\" type=\"application/pdf\"
        title=\"pdf\"/>\n    <summary>Weed control is a critical challenge in modern
        agriculture, as weeds compete with crops for essential nutrient resources,
        significantly reducing crop yield and quality. Traditional weed control methods,
        including chemical and mechanical approaches, have real-life limitations such
        as associated environmental impact and efficiency. An emerging yet effective
        approach is laser weeding, which uses a laser beam as the stem cutter. Although
        there have been studies that use deep learning in weed recognition, its application
        in intelligent laser weeding still requires a comprehensive understanding.
        Thus, this study represents the first empirical investigation of weed recognition
        for laser weeding. To increase the efficiency of laser beam cut and avoid
        damaging the crops of interest, the laser beam shall be directly aimed at
        the weed root. Yet, weed stem detection remains an under-explored problem.
        We integrate the detection of crop and weed with the localization of weed
        stem into one end-to-end system. To train and validate the proposed system
        in a real-life scenario, we curate and construct a high-quality weed stem
        detection dataset with human annotations. The dataset consists of 7,161 high-resolution
        pictures collected in the field with annotations of 11,151 instances of weed.
        Experimental results show that the proposed system improves weeding accuracy
        by 6.7% and reduces energy cost by 32.3% compared to existing weed recognition
        systems.</summary>\n    <category term=\"cs.CV\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <category term=\"cs.AI\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <published>2025-02-10T08:42:46Z</published>\n    <arxiv:comment>Accepted
        by AAAI-AISI 2025</arxiv:comment>\n    <arxiv:primary_category term=\"cs.CV\"/>\n
        \   <author>\n      <name>Dingning Liu</name>\n    </author>\n    <author>\n
        \     <name>Jinzhe Li</name>\n    </author>\n    <author>\n      <name>Haoyang
        Su</name>\n    </author>\n    <author>\n      <name>Bei Cui</name>\n    </author>\n
        \   <author>\n      <name>Zhihui Wang</name>\n    </author>\n    <author>\n
        \     <name>Qingbo Yuan</name>\n    </author>\n    <author>\n      <name>Wanli
        Ouyang</name>\n    </author>\n    <author>\n      <name>Nanqing Dong</name>\n
        \   </author>\n  </entry>\n  <entry>\n    <id>http://arxiv.org/abs/1612.03019v3</id>\n
        \   <title>Automatic Model Based Dataset Generation for Fast and Accurate
        Crop and Weeds Detection</title>\n    <updated>2017-08-06T17:33:20Z</updated>\n
        \   <link href=\"https://arxiv.org/abs/1612.03019v3\" rel=\"alternate\" type=\"text/html\"/>\n
        \   <link href=\"https://arxiv.org/pdf/1612.03019v3\" rel=\"related\" type=\"application/pdf\"
        title=\"pdf\"/>\n    <summary>Selective weeding is one of the key challenges
        in the field of agriculture robotics. To accomplish this task, a farm robot
        should be able to accurately detect plants and to distinguish them between
        crop and weeds. Most of the promising state-of-the-art approaches make use
        of appearance-based models trained on large annotated datasets. Unfortunately,
        creating large agricultural datasets with pixel-level annotations is an extremely
        time consuming task, actually penalizing the usage of data-driven techniques.
        In this paper, we face this problem by proposing a novel and effective approach
        that aims to dramatically minimize the human intervention needed to train
        the detection and classification algorithms. The idea is to procedurally generate
        large synthetic training datasets randomizing the key features of the target
        environment (i.e., crop and weed species, type of soil, light conditions).
        More specifically, by tuning these model parameters, and exploiting a few
        real-world textures, it is possible to render a large amount of realistic
        views of an artificial agricultural scenario with no effort. The generated
        data can be directly used to train the model or to supplement real-world images.
        We validate the proposed methodology by using as testbed a modern deep learning
        based image segmentation architecture. We compare the classification results
        obtained using both real and synthetic images as training data. The reported
        results confirm the effectiveness and the potentiality of our approach.</summary>\n
        \   <category term=\"cs.CV\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <category term=\"cs.RO\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <published>2016-12-09T13:43:19Z</published>\n    <arxiv:comment>To appear
        in IEEE/RSJ IROS 2017</arxiv:comment>\n    <arxiv:primary_category term=\"cs.CV\"/>\n
        \   <author>\n      <name>Maurilio Di Cicco</name>\n    </author>\n    <author>\n
        \     <name>Ciro Potena</name>\n    </author>\n    <author>\n      <name>Giorgio
        Grisetti</name>\n    </author>\n    <author>\n      <name>Alberto Pretto</name>\n
        \   </author>\n    <arxiv:doi>10.1109/IROS.2017.8206408</arxiv:doi>\n    <link
        rel=\"related\" href=\"https://doi.org/10.1109/IROS.2017.8206408\" title=\"doi\"/>\n
        \ </entry>\n  <entry>\n    <id>http://arxiv.org/abs/1912.03600v5</id>\n    <title>Repeatedly
        Energy-Efficient and Fair Service Coverage: UAV Slicing (Proactive UAV Network
        Slicing for URLLC and Mobile Broadband Service Multiplexing)</title>\n    <updated>2020-10-21T06:00:49Z</updated>\n
        \   <link href=\"https://arxiv.org/abs/1912.03600v5\" rel=\"alternate\" type=\"text/html\"/>\n
        \   <link href=\"https://arxiv.org/pdf/1912.03600v5\" rel=\"related\" type=\"application/pdf\"
        title=\"pdf\"/>\n    <summary>Unmanned aerial vehicle (UAV) networks are convinced
        as a significant part of 5G and emerging 6G wireless networks. UAV slicing
        is a promising proposal of converging different services onto a common UAV
        network without deploying individual network solution for each type of service.
        This paper is concerned with UAV slicing for providing energy-efficient and
        fair service coverage for enhanced mobile broadband (eMBB) users (UEs). Aiming
        at physically configuring UAV slices, the UAV slicing problem is formulated
        as a time-dependent mixed-integer-non-convex programming problem with a goal
        of maximizing all UEs' data rates while minimizing UAVs' total transmit power.
        To mitigate this challenging problem, we first decompose the original problem
        into two time-dependent subproblems using a Lyapunov approach. We then derive
        the procedure of tackling the non-convexity and the mixed-integer property
        of the subproblems by exploring a successive convex approximate (SCA) method
        and an alternative optimization scheme, respectively. Based on the derived
        results, we develop an algorithm with provable performance guarantees to mitigate
        the two subproblems repeatedly.</summary>\n    <category term=\"cs.NI\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <published>2019-12-08T03:01:10Z</published>\n    <arxiv:comment>The original
        title is: Repeatedly Energy-Efficient and Fair Service Coverage: UAV Slicing</arxiv:comment>\n
        \   <arxiv:primary_category term=\"cs.NI\"/>\n    <author>\n      <name>Peng
        Yang</name>\n    </author>\n    <author>\n      <name>Xing Xi</name>\n    </author>\n
        \   <author>\n      <name>Tony Q. S. Quek</name>\n    </author>\n    <author>\n
        \     <name>Jingxuan Chen</name>\n    </author>\n    <author>\n      <name>Xianbin
        Cao</name>\n    </author>\n    <author>\n      <name>Dapeng Wu</name>\n    </author>\n
        \ </entry>\n  <entry>\n    <id>http://arxiv.org/abs/2603.00160v1</id>\n    <title>DINOv3
        Meets YOLO26 for Weed Detection in Vegetable Crops</title>\n    <updated>2026-02-25T22:35:09Z</updated>\n
        \   <link href=\"https://arxiv.org/abs/2603.00160v1\" rel=\"alternate\" type=\"text/html\"/>\n
        \   <link href=\"https://arxiv.org/pdf/2603.00160v1\" rel=\"related\" type=\"application/pdf\"
        title=\"pdf\"/>\n    <summary>Developing robust models for precision vegetable
        weeding is currently constrained by the scarcity of large-scale, annotated
        weed-crop datasets. To address this limitation, this study proposes a foundational
        crop-weed detection model by integrating heterogeneous datasets and leveraging
        self-supervised learning. A total of 618,642 crop-weed images were initially
        collected and subsequently refined to 199,388 filtered images for fine-tuning
        a DINOv3 vision transformer (ViT-small) through a sequential curation strategy.
        The fine-tuned DINOv3 backbone was then integrated into YOLO26, serving either
        as a primary backbone or part of a dual-backbone architecture. A feature alignment
        loss was introduced in the dual backbone framework to enhance feature fusion
        with minimal computational overhead. Experimental results show that the proposed
        DINOv3-finetuned ViT-small-based YOLO26-large achieved up to a +5.4% mAP50
        gain on in-domain images collected in the 2025 season. Moreover, it demonstrated
        strong cross-domain generalization with mAP50 improvements of +14.0% on the
        2021-2023 season dataset and +11.9% on the 2024 season dataset, compared to
        the standard YOLO26-large. Although the DINOv3-YOLO26-large model has 45.6%
        more parameters and a 2.9x increase in inference latency, it maintains real-time
        performance at ~28.5 frames per second (fps). The curated dataset and software
        programs developed in this study will be made publicly available.</summary>\n
        \   <category term=\"cs.CV\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <category term=\"cs.AI\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <published>2026-02-25T22:35:09Z</published>\n    <arxiv:comment>10 pages,
        2 figures</arxiv:comment>\n    <arxiv:primary_category term=\"cs.CV\"/>\n
        \   <author>\n      <name>Boyang Deng</name>\n    </author>\n    <author>\n
        \     <name>Yuzhen Lu</name>\n    </author>\n  </entry>\n  <entry>\n    <id>http://arxiv.org/abs/2312.03443v1</id>\n
        \   <title>Data-driven Crop Growth Simulation on Time-varying Generated Images
        using Multi-conditional Generative Adversarial Networks</title>\n    <updated>2023-12-06T11:54:50Z</updated>\n
        \   <link href=\"https://arxiv.org/abs/2312.03443v1\" rel=\"alternate\" type=\"text/html\"/>\n
        \   <link href=\"https://arxiv.org/pdf/2312.03443v1\" rel=\"related\" type=\"application/pdf\"
        title=\"pdf\"/>\n    <summary>Image-based crop growth modeling can substantially
        contribute to precision agriculture by revealing spatial crop development
        over time, which allows an early and location-specific estimation of relevant
        future plant traits, such as leaf area or biomass. A prerequisite for realistic
        and sharp crop image generation is the integration of multiple growth-influencing
        conditions in a model, such as an image of an initial growth stage, the associated
        growth time, and further information about the field treatment. We present
        a two-stage framework consisting first of an image prediction model and second
        of a growth estimation model, which both are independently trained. The image
        prediction model is a conditional Wasserstein generative adversarial network
        (CWGAN). In the generator of this model, conditional batch normalization (CBN)
        is used to integrate different conditions along with the input image. This
        allows the model to generate time-varying artificial images dependent on multiple
        influencing factors of different kinds. These images are used by the second
        part of the framework for plant phenotyping by deriving plant-specific traits
        and comparing them with those of non-artificial (real) reference images. For
        various crop datasets, the framework allows realistic, sharp image predictions
        with a slight loss of quality from short-term to long-term predictions. Simulations
        of varying growth-influencing conditions performed with the trained framework
        provide valuable insights into how such factors relate to crop appearances,
        which is particularly useful in complex, less explored crop mixture systems.
        Further results show that adding process-based simulated biomass as a condition
        increases the accuracy of the derived phenotypic traits from the predicted
        images. This demonstrates the potential of our framework to serve as an interface
        between an image- and process-based crop growth model.</summary>\n    <category
        term=\"cs.CV\" scheme=\"http://arxiv.org/schemas/atom\"/>\n    <category term=\"stat.ML\"
        scheme=\"http://arxiv.org/schemas/atom\"/>\n    <published>2023-12-06T11:54:50Z</published>\n
        \   <arxiv:comment>26 pages, 16 figures, code available at https://github.com/luked12/crop-growth-cgan</arxiv:comment>\n
        \   <arxiv:primary_category term=\"cs.CV\"/>\n    <author>\n      <name>Lukas
        Drees</name>\n    </author>\n    <author>\n      <name>Dereje T. Demie</name>\n
        \   </author>\n    <author>\n      <name>Madhuri R. Paul</name>\n    </author>\n
        \   <author>\n      <name>Johannes Leonhardt</name>\n    </author>\n    <author>\n
        \     <name>Sabine J. Seidel</name>\n    </author>\n    <author>\n      <name>Thomas
        F. D\xF6ring</name>\n    </author>\n    <author>\n      <name>Ribana Roscher</name>\n
        \   </author>\n    <arxiv:doi>10.1186/s13007-024-01205-3</arxiv:doi>\n    <link
        rel=\"related\" href=\"https://doi.org/10.1186/s13007-024-01205-3\" title=\"doi\"/>\n
        \ </entry>\n  <entry>\n    <id>http://arxiv.org/abs/1801.00444v2</id>\n    <title>Common
        Throughput Maximization in UAV-Enabled OFDMA Systems with Delay Consideration</title>\n
        \   <updated>2018-01-06T06:52:11Z</updated>\n    <link href=\"https://arxiv.org/abs/1801.00444v2\"
        rel=\"alternate\" type=\"text/html\"/>\n    <link href=\"https://arxiv.org/pdf/1801.00444v2\"
        rel=\"related\" type=\"application/pdf\" title=\"pdf\"/>\n    <summary>The
        use of unmanned aerial vehicles (UAVs) as communication platforms is of great
        practical significance in future wireless networks, especially for on-demand
        deployment in temporary events and emergency situations. Although prior works
        have shown the performance improvement by exploiting the UAV's mobility, they
        mainly focus on delay-tolerant applications. As delay requirements fundamentally
        limit the UAV's mobility, it remains unknown whether the UAV is able to provide
        any performance gain in delay-constrained communication scenarios. Motivated
        by this, we study in this paper a UAV-enabled orthogonal frequency division
        multiple access (OFDMA) network where a UAV is dispatched as a mobile base
        station (BS) to serve a group of users on the ground. We consider a minimum-rate
        ratio (MRR) for each user, defined as the minimum instantaneous rate required
        over the average achievable throughput, to flexibly adjust the percentage
        of its delay-constrained data traffic. Under a given set of constraints on
        the users' MRRs, we aim to maximize the minimum average throughput of all
        users by jointly optimizing the UAV trajectory and OFDMA resource allocation.
        First, we show that the max-min throughput in general decreases as the users'
        MRR constraints become more stringent, which reveals a fundamental throughput-delay
        tradeoff in UAV-enabled communications. Next, we propose an iterative parameter-assisted
        block coordinate descent method to optimize the UAV trajectory and OFDMA resource
        allocation alternately, by applying the successive convex optimization and
        the Lagrange duality, respectively. Furthermore, an efficient and systematic
        UAV trajectory initialization scheme is proposed based on a simple circular
        trajectory. Finally, simulation results are provided to verify our theoretical
        findings and demonstrate the effectiveness of our proposed designs.</summary>\n
        \   <category term=\"cs.IT\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <category term=\"math.DS\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <category term=\"math.HO\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <category term=\"math.OC\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <published>2018-01-01T13:41:00Z</published>\n    <arxiv:comment>[UAV-Enabled
        Aerial Base Station (BS) II] Submitted to IEEE Transactions on Communications.
        This is the second of a series of three works (trilogy) that focus on UAV-enabled
        aerial BS for wireless networks. The other two works are \"Joint Trajectory
        and Communication Design for Multi-UAV Enabled Wireless Networks\" and \"Capacity
        Characterization of UAV-Enabled Two-User Broadcast Channel\"</arxiv:comment>\n
        \   <arxiv:primary_category term=\"cs.IT\"/>\n    <author>\n      <name>Qingqing
        Wu</name>\n    </author>\n    <author>\n      <name>Rui Zhang</name>\n    </author>\n
        \ </entry>\n  <entry>\n    <id>http://arxiv.org/abs/2102.05755v2</id>\n    <title>Development
        of Crop Yield Estimation Model using Soil and Environmental Parameters</title>\n
        \   <updated>2025-12-29T08:29:43Z</updated>\n    <link href=\"https://arxiv.org/abs/2102.05755v2\"
        rel=\"alternate\" type=\"text/html\"/>\n    <link href=\"https://arxiv.org/pdf/2102.05755v2\"
        rel=\"related\" type=\"application/pdf\" title=\"pdf\"/>\n    <summary>Crop
        yield is affected by various soil and environmental parameters and can vary
        significantly. Therefore, a crop yield estimation model which can predict
        pre-harvest yield is required for food security. The study is conducted on
        tea forms operating under National Tea Research Institute, Pakistan. The data
        is recorded on monthly basis for ten years period. The parameters collected
        are minimum and maximum temperature, humidity, rainfall, PH level of the soil,
        usage of pesticide and labor expertise. The design of model incorporated all
        of these parameters and identified the parameters which are most crucial for
        yield predictions. Feature transformation is performed to obtain better performing
        model. The designed model is based on an ensemble of neural networks and provided
        an R-squared of 0.9461 and RMSE of 0.1204 indicating the usability of the
        proposed model in yield forecasting based on surface and environmental parameters.</summary>\n
        \   <category term=\"cs.LG\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <published>2021-02-10T22:02:13Z</published>\n    <arxiv:comment>crop yield
        forecasting, regression, data mining, artificial neural network, ensemble
        learning</arxiv:comment>\n    <arxiv:primary_category term=\"cs.LG\"/>\n    <arxiv:journal_ref>Journal
        of Agricultural Research (JAR), 59(3), pp. 295-303, 2021</arxiv:journal_ref>\n
        \   <author>\n      <name>Nisar Ahmed</name>\n    </author>\n    <author>\n
        \     <name>Hafiz Muhammad Shahzad Asif</name>\n    </author>\n    <author>\n
        \     <name>Gulshan Saleem</name>\n    </author>\n    <author>\n      <name>Muhammad
        Usman Younus</name>\n    </author>\n    <arxiv:doi>10.58475/ad2vgd97</arxiv:doi>\n
        \   <link rel=\"related\" href=\"https://doi.org/10.58475/ad2vgd97\" title=\"doi\"/>\n
        \ </entry>\n  <entry>\n    <id>http://arxiv.org/abs/2610.11049v2</id>\n    <title>SatFix:
        Absolute Visual Localization of UAVs in Satellite Maps from a Single Oblique
        Image</title>\n    <updated>2026-10-19T01:41:37Z</updated>\n    <link href=\"https://arxiv.org/abs/2610.11049v2\"
        rel=\"alternate\" type=\"text/html\"/>\n    <link href=\"https://arxiv.org/pdf/2610.11049v2\"
        rel=\"related\" type=\"application/pdf\" title=\"pdf\"/>\n    <summary>We
        study absolute metric UAV localization within a provided geo-referenced satellite
        region, recovering continuous map position and viewing heading from a single
        oblique image or a short multi-view clip. Existing cross-view geo-localization
        methods retrieve the most similar satellite tile from a gallery and report
        Recall@K, but retrieval depends on gallery sampling, provides no heading estimate,
        and returns a tile index rather than a continuous coordinate. We propose SatFix,
        a feed-forward UAV--satellite localization framework built on VGGT-$\u03A9$.
        Satellite-grid features act as queries that aggregate UAV visual evidence,
        and two lightweight heads regress a 3-DoF pose in the satellite-map frame:
        continuous 2D position and heading. SatFix requires no explicit 3D map, rendered
        bird's-eye image, auxiliary sensor, or test-time pose alignment. A single
        model supports both single- and multi-view inputs, with trajectory constraints
        used during multi-view training. For metric evaluation, we introduce University-Metric,
        where satellite imagery is re-collected over a region up to 10.7$\\times$
        longer on a side (about 114$\\times$ the ground area) than the original University-1652
        tiles, with continuous position and heading labels for the original UAV tours.
        With one UAV view, SatFix localizes 52.08% of test frames within 50 m and
        17.34% within 10 m, with median position and heading errors of 45.66 m and
        $20.81^\\circ$, respectively. Inference takes under 0.1 s per single-view
        query on an NVIDIA RTX 4090. With nine UAV views, the median position error
        falls to 21.96 m and the median heading error to $8.73^\\circ$. Compared with
        a fine-tuned VGGT-$\u03A9$ baseline, SatFix reduces median position error
        by 34.0% and nine-view median heading error from $25.43^\\circ$ to $8.73^\\circ$.</summary>\n
        \   <category term=\"cs.CV\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <published>2026-10-08T01:01:46Z</published>\n    <arxiv:comment>Satellite
        images at multiple resolutions are available at: https://1drv.ms/u/c/758af5fc520c81c5/IQCjvHc3iiq6SJDpYipcIv5vAc-NmHMPCAwSTBnrA1vhM5U?e=YSX1lZ
        UAV images can be downloaded from the original University-1652 dataset</arxiv:comment>\n
        \   <arxiv:primary_category term=\"cs.CV\"/>\n    <author>\n      <name>Jiarui
        Zeng</name>\n    </author>\n    <author>\n      <name>Kun Shi</name>\n    </author>\n
        \   <author>\n      <name>Chiman Vong</name>\n    </author>\n    <author>\n
        \     <name>Zhedong Zheng</name>\n    </author>\n  </entry>\n  <entry>\n    <id>http://arxiv.org/abs/1907.06181v2</id>\n
        \   <title>Hybrid Offline-Online Design for UAV-Enabled Data Harvesting in
        Probabilistic LoS Channel</title>\n    <updated>2020-01-02T12:51:15Z</updated>\n
        \   <link href=\"https://arxiv.org/abs/1907.06181v2\" rel=\"alternate\" type=\"text/html\"/>\n
        \   <link href=\"https://arxiv.org/pdf/1907.06181v2\" rel=\"related\" type=\"application/pdf\"
        title=\"pdf\"/>\n    <summary>This paper considers an unmanned aerial vehicle
        (UAV)-enabled wireless sensor network (WSN) in urban areas, where a UAV is
        deployed to collect data from distributed sensor nodes (SNs) within a given
        duration. To characterize the occasional building blockage between the UAV
        and SNs, we construct the probabilistic line-of-sight (LoS) channel model
        for a Manhattan-type city by using the combined simulation and data regression
        method, which is shown in the form of a generalized logistic function of the
        UAV-SN elevation angle. We assume that only the knowledge of SNs' locations
        and the probabilistic LoS channel model is known a priori, while the UAV can
        obtain the instantaneous LoS/Non-LoS channel state information (CSI) with
        the SNs in real time along its flight. Our objective is to maximize the minimum
        (average) data collection rate from all the SNs for the UAV. To this end,
        we formulate a new rate maximization problem by jointly optimizing the UAV
        three-dimensional (3D) trajectory and transmission scheduling of SNs. Although
        the optimal solution is intractable due to the lack of the complete UAV-SNs
        CSI, we propose in this paper a novel and general design method, called hybrid
        offline-online optimization, to obtain a suboptimal solution to it, by leveraging
        both the statistical and real-time CSI. Essentially, our proposed method decouples
        the joint design of UAV trajectory and communication scheduling into two phases:
        namely, an offline phase that determines the UAV path prior to its flight
        based on the probabilistic LoS channel model, followed by an online phase
        that adaptively adjusts the UAV flying speeds along the offline optimized
        path as well as communication scheduling based on the instantaneous UAV-SNs
        CSI and SNs' individual amounts of data received accumulatively.</summary>\n
        \   <category term=\"cs.IT\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <category term=\"cs.NI\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <published>2019-07-14T07:42:13Z</published>\n    <arxiv:comment>The paper
        has been submitted to IEEE for possible publication. This is the second of
        the authors' series works on developing UAV trajectory under the more practical
        UAV-ground channel model instead of the simplified LoS channel model. The
        first one is \"3D Trajectory Optimization in Rician Fading for UAV-Enabled
        Data Harvesting\"</arxiv:comment>\n    <arxiv:primary_category term=\"cs.IT\"/>\n
        \   <author>\n      <name>Changsheng You</name>\n    </author>\n    <author>\n
        \     <name>Rui Zhang</name>\n    </author>\n  </entry>\n  <entry>\n    <id>http://arxiv.org/abs/2412.11717v2</id>\n
        \   <title>UAV-based path planning for efficient localization of non-uniformly
        distributed weeds using prior knowledge: A reinforcement-learning approach</title>\n
        \   <updated>2025-06-27T12:43:49Z</updated>\n    <link href=\"https://arxiv.org/abs/2412.11717v2\"
        rel=\"alternate\" type=\"text/html\"/>\n    <link href=\"https://arxiv.org/pdf/2412.11717v2\"
        rel=\"related\" type=\"application/pdf\" title=\"pdf\"/>\n    <summary>UAVs
        are becoming popular in agriculture, however, they usually use time-consuming
        row-by-row flight paths. This paper presents a deep-reinforcement-learning-based
        approach for path planning to efficiently localize weeds in agricultural fields
        using UAVs with minimal flight-path length. The method combines prior knowledge
        about the field containing uncertain, low-resolution weed locations with in-flight
        weed detections. The search policy was learned using deep Q-learning. We trained
        the agent in simulation, allowing a thorough evaluation of the weed distribution,
        typical errors in the perception system, prior knowledge, and different stopping
        criteria on the planner's performance. When weeds were non-uniformly distributed
        over the field, the agent found them faster than a row-by-row path, showing
        its capability to learn and exploit the weed distribution. Detection errors
        and prior knowledge quality had a minor effect on the performance, indicating
        that the learned search policy was robust to detection errors and did not
        need detailed prior knowledge. The agent also learned to terminate the search.
        To test the transferability of the learned policy to a real-world scenario,
        the planner was tested on real-world image data without further training,
        which showed a 66% shorter path compared to a row-by-row path at the cost
        of a 10% lower percentage of found weeds. Strengths and weaknesses of the
        planner for practical application are comprehensively discussed, and directions
        for further development are provided. Overall, it is concluded that the learned
        search policy can improve the efficiency of finding non-uniformly distributed
        weeds using a UAV and shows potential for use in agricultural practice.</summary>\n
        \   <category term=\"cs.RO\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <published>2024-12-16T12:39:02Z</published>\n    <arxiv:primary_category
        term=\"cs.RO\"/>\n    <arxiv:journal_ref>Computers and Electronics in Agriculture
        237 (2025) 1-14</arxiv:journal_ref>\n    <author>\n      <name>Rick van Essen</name>\n
        \   </author>\n    <author>\n      <name>Eldert van Henten</name>\n    </author>\n
        \   <author>\n      <name>Gert Kootstra</name>\n    </author>\n    <arxiv:doi>10.1016/j.compag.2025.110651</arxiv:doi>\n
        \   <link rel=\"related\" href=\"https://doi.org/10.1016/j.compag.2025.110651\"
        title=\"doi\"/>\n  </entry>\n  <entry>\n    <id>http://arxiv.org/abs/2610.37022v1</id>\n
        \   <title>Crop Yield Prediction Using Regression Models: A Comparative Evaluation
        of Model Performance</title>\n    <updated>2026-10-27T10:58:16Z</updated>\n
        \   <link href=\"https://arxiv.org/abs/2610.37022v1\" rel=\"alternate\" type=\"text/html\"/>\n
        \   <link href=\"https://arxiv.org/pdf/2610.37022v1\" rel=\"related\" type=\"application/pdf\"
        title=\"pdf\"/>\n    <summary>Reliable crop-yield prediction can support agricultural
        planning and resource allocation. This study evaluates five regression models
        for predicting crop yield from environmental, crop-related, and agricultural
        management variables. The dataset initially contained 1,000,000 observations
        and ten variables, with 231 observations having negative target values removed
        during preprocessing. Categorical variables were represented using one-hot
        encoding, and Boolean variables were converted into binary values. The models
        considered were multiple linear regression (LR), random-forest regression
        (RF), decision-tree regression (DT), ridge regression, and lasso regression.
        Their performance was evaluated using 80:20 and 70:30 training-testing splits
        based on the coefficient of determination (R-squared), mean squared error
        (MSE), and root mean squared error (RMSE). Applying an 80:20 split, LR achieved
        a test R-squared of approximately 0.9130 and a test RMSE of 0.5008. Applying
        a 70:30 split, lasso regression yielded the highest test R-squared (approximately
        0.9131) and the lowest test RMSE (approximately 0.5008), with performance
        almost identical to LR and ridge regression. DT also showed improved test
        performance under the 70:30 split, whereas RF exhibited a substantial gap
        between training and testing performance. These results indicate that the
        evaluated linear regression model provides competitive baselines for this
        dataset. Further experimentation, including validation testing, will help
        determine the models' performance and predictability.</summary>\n    <category
        term=\"cs.LG\" scheme=\"http://arxiv.org/schemas/atom\"/>\n    <category term=\"cs.AI\"
        scheme=\"http://arxiv.org/schemas/atom\"/>\n    <published>2026-10-27T10:58:16Z</published>\n
        \   <arxiv:comment>Experimental evaluation of crop-yield prediction using
        regression models</arxiv:comment>\n    <arxiv:primary_category term=\"cs.LG\"/>\n
        \   <author>\n      <name>Saptak Das</name>\n    </author>\n    <author>\n
        \     <name>Arijit Sarkar</name>\n    </author>\n    <author>\n      <name>Soumik
        Neogi</name>\n    </author>\n    <author>\n      <name>Suborno Naskar</name>\n
        \   </author>\n  </entry>\n  <entry>\n    <id>http://arxiv.org/abs/2201.05271v1</id>\n
        \   <title>Trajectory and Transmit Power Optimization for IRS-Assisted UAV
        Communication under Malicious Jamming</title>\n    <updated>2022-01-14T01:35:47Z</updated>\n
        \   <link href=\"https://arxiv.org/abs/2201.05271v1\" rel=\"alternate\" type=\"text/html\"/>\n
        \   <link href=\"https://arxiv.org/pdf/2201.05271v1\" rel=\"related\" type=\"application/pdf\"
        title=\"pdf\"/>\n    <summary>In this letter, we investigate an unmanned aerial
        vehicle (UAV) communication system, where an intelligent reflecting surface
        (IRS) is deployed to assist in the transmission from a ground node (GN) to
        the UAV in the presence of a jammer. We aim to maximize the average rate of
        the UAV communication by jointly optimizing the GN's transmit power, the IRS's
        passive beamforming and the UAV's trajectory. However, the formulated problem
        is difficult to solve due to the non-convex objective function and the coupled
        optimization variables. Thus, to tackle it, we propose an alternating optimization
        (AO) based algorithm by exploiting the successive convex approximation (SCA)
        and semidefinite relaxation (SDR) techniques. Simulation results show that
        the proposed algorithm can significantly improve the average rate compared
        with the benchmark algorithms. Moreover, it also shows that when the jamming
        power is large and the number of IRS elements is relatively small, deploying
        the IRS near the jammer outperforms deploying it near the GN, and vice versa.</summary>\n
        \   <category term=\"eess.SP\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <category term=\"cs.IT\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <published>2022-01-14T01:35:47Z</published>\n    <arxiv:comment>IRS-Assisted
        UAV Communication under Malicious Jamming</arxiv:comment>\n    <arxiv:primary_category
        term=\"eess.SP\"/>\n    <author>\n      <name>Zhi Ji</name>\n    </author>\n
        \   <author>\n      <name>Wendong Yang</name>\n    </author>\n    <author>\n
        \     <name>Xinrong Guan</name>\n    </author>\n    <author>\n      <name>Xiao
        Zhao</name>\n    </author>\n    <author>\n      <name>Guoxin Li</name>\n    </author>\n
        \   <author>\n      <name>Qingqing Wu</name>\n    </author>\n  </entry>\n
        \ <entry>\n    <id>http://arxiv.org/abs/1810.10839v1</id>\n    <title>Exploiting
        NOMA for Multi-Beam UAV Communication in Cellular Uplink</title>\n    <updated>2018-10-25T12:05:15Z</updated>\n
        \   <link href=\"https://arxiv.org/abs/1810.10839v1\" rel=\"alternate\" type=\"text/html\"/>\n
        \   <link href=\"https://arxiv.org/pdf/1810.10839v1\" rel=\"related\" type=\"application/pdf\"
        title=\"pdf\"/>\n    <summary>Unmanned aerial vehicles (UAVs) are expected
        to be an important new class of users in the fifth generation (5G) and beyond
        5G cellular networks. In particular, there are emerging UAV applications such
        as aerial photograph and data relaying that require high-speed communications
        between the UAVs and the ground base stations (GBSs). Due to the high UAV
        altitude, the strong line-of-sight (LoS) links generally dominate the channels
        between the UAVs and GBSs, which brings both opportunities and challenges
        in the design of future wireless networks supporting both terrestrial and
        aerial users. Although each UAV can associate with more GBSs for communication
        as compared to terrestrial users thanks to the LoS-dominant channels, it also
        causes/suffers more severe interference to/from the terrestrial communications
        in the uplink/downlink. This paper studies the uplink communication from a
        multi-antenna UAV to a set of GBSs within its signal coverage by considering
        a practical yet challenging scenario when the number of antennas at the UAV
        is smaller than that of co-channel GBSs. To achieve high-rate transmission
        yet avoid interfering with any of the existing terrestrial communications
        at the co-channel GBSs, we propose a novel multi-beam transmission strategy
        by exploiting the non-orthogonal multiple access (NOMA) technique. Specifically,
        the UAV sends each data stream to a selected subset of the GBSs, which can
        decode the UAV's signals and then cancel them before decoding the messages
        of their served terrestrial users, and in the meanwhile nulls its interference
        at the other GBSs via zero-forcing (ZF) beamforming. To draw essential insight,
        we first characterize in closed-form the degrees-of-freedom (DoF) under the
        proposed strategy. Then, we propose an efficient algorithm to maximize the
        UAV's transmit rate subject to the interference avoidance constraints for
        protecting the terrestrial users.</summary>\n    <category term=\"cs.IT\"
        scheme=\"http://arxiv.org/schemas/atom\"/>\n    <published>2018-10-25T12:05:15Z</published>\n
        \   <arxiv:comment>submitted to ICC 2019. More information about this direction
        can be found here https://sites.google.com/site/liulianggoodluck/uav</arxiv:comment>\n
        \   <arxiv:primary_category term=\"cs.IT\"/>\n    <author>\n      <name>Liang
        Liu</name>\n    </author>\n    <author>\n      <name>Shuowen Zhang</name>\n
        \   </author>\n    <author>\n      <name>Rui Zhang</name>\n    </author>\n
        \ </entry>\n</feed>\n"
