        de la mod\u00e9lisation de groupes aupr\u00e8s des professionnels du secteur
        public. Les organismes de la faune sauvage commencent tout juste \u00e0 utiliser
        des outils d\u00e9cisionnels structur\u00e9s et les \u00e9tudes de cas rigoureuses
