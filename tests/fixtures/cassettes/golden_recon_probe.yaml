        type=\"application/atom+xml\"/>\n  <opensearch:itemsPerPage>25</opensearch:itemsPerPage>\n
        \ <opensearch:totalResults>199720</opensearch:totalResults>\n  <opensearch:startIndex>0</opensearch:startIndex>\n
        \ <entry>\n    <id>http://arxiv.org/abs/2603.01932v2</id>\n    <title>BAWSeg:
        A UAV Multispectral Benchmark for Barley Weed Segmentation</title>\n    <updated>2026-03-17T17:55:38Z</updated>\n
        \   <link href=\"https://arxiv.org/abs/2603.01932v2\" rel=\"alternate\" type=\"text/html\"/>\n
        \   <link href=\"https://arxiv.org/pdf/2603.01932v2\" rel=\"related\" type=\"application/pdf\"
        title=\"pdf\"/>\n    <summary>Accurate weed mapping in cereal fields requires
        pixel-level segmentation from UAV imagery that remains reliable across fields,
        seasons, and illumination. Existing multispectral pipelines often depend on
        thresholded vegetation indices, which are brittle under radiometric drift
        and mixed crop--weed pixels, or on single-stream CNN and Transformer backbones
        that ingest stacked bands and indices, where radiance cues and normalized
        index cues interfere and reduce sensitivity to small weed clusters embedded
        in crop canopy. We propose VISA, a two-stream segmentation network that decouples
        these cues and fuses them at native resolution. The radiance stream learns
        from calibrated five-band reflectance using local residual convolutions, channel
        recalibration, spatial gating, and skip-connected decoding, which preserve
        fine textures, row boundaries, and small weed structures that are often weakened
        after ratio-based index compression. The index stream operates on vegetation-index
        maps with windowed self-attention to model local structure efficiently, state-space
        layers to propagate field-scale context without quadratic attention cost,
        and Slot Attention to form stable region descriptors that improve discrimination
        of sparse weeds under canopy mixing. To support supervised training and deployment-oriented
        evaluation, we introduce BAWSeg, a four-year UAV multispectral dataset collected
        over commercial barley paddocks in Western Australia, providing radiometrically
        calibrated blue, green, red, red edge, and near-infrared orthomosaics, derived
        vegetation indices, and dense crop, weed, and other labels with leakage-free
        block splits. On BAWSeg, VISA achieves 75.6% mIoU and 63.5% weed IoU with
        22.8 M parameters, outperforming a multispectral SegFormer-B1 baseline by
        1.2 mIoU and 1.9 weed IoU. Under cross-plot and cross-year protocols, VISA
        maintains 71.2% and 69.2% mIoU, respectively.</summary>\n    <category term=\"cs.CV\"
        scheme=\"http://arxiv.org/schemas/atom\"/>\n    <published>2026-03-02T14:49:05Z</published>\n
        \   <arxiv:comment>This article has been published in Remote Sensing as part
        of the Special Issue Intelligent UAV Remote Sensing for Next-Generation Precision
        Agriculture</arxiv:comment>\n    <arxiv:primary_category term=\"cs.CV\"/>\n
        \   <author>\n      <name>Haitian Wang</name>\n    </author>\n    <author>\n
        \     <name>Xinyu Wang</name>\n    </author>\n    <author>\n      <name>Muhammad
        Ibrahim</name>\n    </author>\n    <author>\n      <name>Dustin Severtson</name>\n
        \   </author>\n    <author>\n      <name>Ajmal Mian</name>\n    </author>\n
        \ </entry>\n  <entry>\n    <id>http://arxiv.org/abs/2210.11545v1</id>\n    <title>Transferring
        learned patterns from ground-based field imagery to predict UAV-based imagery
        for crop and weed semantic segmentation in precision crop farming</title>\n
        \   <updated>2022-10-20T19:25:06Z</updated>\n    <link href=\"https://arxiv.org/abs/2210.11545v1\"
        rel=\"alternate\" type=\"text/html\"/>\n    <link href=\"https://arxiv.org/pdf/2210.11545v1\"
        rel=\"related\" type=\"application/pdf\" title=\"pdf\"/>\n    <summary>Weed
        and crop segmentation is becoming an increasingly integral part of precision
        farming that leverages the current computer vision and deep learning technologies.
        Research has been extensively carried out based on images captured with a
        camera from various platforms. Unmanned aerial vehicles (UAVs) and ground-based
        vehicles including agricultural robots are the two popular platforms for data
        collection in fields. They all contribute to site-specific weed management
        (SSWM) to maintain crop yield. Currently, the data from these two platforms
        is processed separately, though sharing the same semantic objects (weed and
        crop). In our paper, we have developed a deep convolutional network that enables
        to predict both field and aerial images from UAVs for weed segmentation and
        mapping with only field images provided in the training phase. The network
        learning process is visualized by feature maps at shallow and deep layers.
        The results show that the mean intersection of union (IOU) values of the segmentation
        for the crop (maize), weeds, and soil background in the developed model for
        the field dataset are 0.744, 0.577, 0.979, respectively, and the performance
        of aerial images from an UAV with the same model, the IOU values of the segmentation
        for the crop (maize), weeds and soil background are 0.596, 0.407, and 0.875,
        respectively. To estimate the effect on the use of plant protection agents,
        we quantify the relationship between herbicide spraying saving rate and grid
        size (spraying resolution) based on the predicted weed map. The spraying saving
        rate is up to 90% when the spraying resolution is at 1.78 x 1.78 cm2. The
        study shows that the developed deep convolutional neural network could be
        used to classify weeds from both field and aerial images and delivers satisfactory
        results.</summary>\n    <category term=\"cs.CV\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <category term=\"cs.LG\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <published>2022-10-20T19:25:06Z</published>\n    <arxiv:primary_category
        term=\"cs.CV\"/>\n    <author>\n      <name>Junfeng Gao</name>\n    </author>\n
        \   <author>\n      <name>Wenzhi Liao</name>\n    </author>\n    <author>\n
        \     <name>David Nuyttens</name>\n    </author>\n    <author>\n      <name>Peter
        Lootens</name>\n    </author>\n    <author>\n      <name>Erik Alexandersson</name>\n
        \   </author>\n    <author>\n      <name>Jan Pieters</name>\n    </author>\n
        \ </entry>\n  <entry>\n    <id>http://arxiv.org/abs/2507.12590v2</id>\n    <title>From
        Time-series Generation, Model Selection to Transfer Learning: A Comparative
        Review of Pixel-wise Approaches for Large-scale Crop Mapping</title>\n    <updated>2025-08-10T03:45:28Z</updated>\n
        \   <link href=\"https://arxiv.org/abs/2507.12590v2\" rel=\"alternate\" type=\"text/html\"/>\n
        \   <link href=\"https://arxiv.org/pdf/2507.12590v2\" rel=\"related\" type=\"application/pdf\"
        title=\"pdf\"/>\n    <summary>Crop mapping involves identifying and classifying
        crop types using spatial data, primarily derived from remote sensing imagery.
        This study presents the first comprehensive review of large-scale, pixel-wise
        crop mapping workflows, encompassing both conventional supervised methods
        and emerging transfer learning approaches. To identify the optimal time-series
        generation approaches and supervised crop mapping models, we conducted systematic
        experiments, comparing six widely adopted satellite image-based preprocessing
        methods, alongside eleven supervised pixel-wise classification models. Additionally,
        we assessed the synergistic impact of varied training sample sizes and variable
        combinations. Moreover, we identified optimal transfer learning techniques
        for different magnitudes of domain shift. The evaluation of optimal methods
        was conducted across five diverse agricultural sites. Landsat 8 served as
        the primary satellite data source. Labels come from CDL trusted pixels and
        field surveys.\n  Our findings reveal three key insights. First, fine-scale
        interval preprocessing paired with Transformer models consistently delivered
        optimal performance for both supervised and transferable workflows. RF offered
        rapid training and competitive performance in conventional supervised learning
        and direct transfer to similar domains. Second, transfer learning techniques
        enhanced workflow adaptability, with UDA being effective for homogeneous crop
        classes while fine-tuning remains robust across diverse scenarios. Finally,
        workflow choice depends heavily on the availability of labeled samples. With
        a sufficient sample size, supervised training typically delivers more accurate
        and generalizable results. Below a certain threshold, transfer learning that
        matches the level of domain shift is a viable alternative to achieve crop
        mapping. All code is publicly available to encourage reproducibility practice.</summary>\n
        \   <category term=\"cs.CV\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <category term=\"cs.LG\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <published>2025-07-16T19:18:25Z</published>\n    <arxiv:comment>A review
        paper on pixel-wise approaches for large-scale crop mapping. 29 pages, 18
        figures. Preprint</arxiv:comment>\n    <arxiv:primary_category term=\"cs.CV\"/>\n
        \   <arxiv:journal_ref>Computers and Electronics in Agriculture, Volume 246,
        May 2026, 111646</arxiv:journal_ref>\n    <author>\n      <name>Judy Long</name>\n
        \   </author>\n    <author>\n      <name>Tao Liu</name>\n    </author>\n    <author>\n
        \     <name>Sean Alexander Woznicki</name>\n    </author>\n    <author>\n
        \     <name>Miljana Markovi\u0107</name>\n    </author>\n    <author>\n      <name>Oskar
        Marko</name>\n    </author>\n    <author>\n      <name>Molly Sears</name>\n
        \   </author>\n    <arxiv:doi>10.1016/j.compag.2026.111646</arxiv:doi>\n    <link
        rel=\"related\" href=\"https://doi.org/10.1016/j.compag.2026.111646\" title=\"doi\"/>\n
        \ </entry>\n  <entry>\n    <id>http://arxiv.org/abs/2502.13103v1</id>\n    <title>WeedsGalore:
        A Multispectral and Multitemporal UAV-based Dataset for Crop and Weed Segmentation
        in Agricultural Maize Fields</title>\n    <updated>2025-02-18T18:13:19Z</updated>\n
        \   <link href=\"https://arxiv.org/abs/2502.13103v1\" rel=\"alternate\" type=\"text/html\"/>\n
        \   <link href=\"https://arxiv.org/pdf/2502.13103v1\" rel=\"related\" type=\"application/pdf\"
        title=\"pdf\"/>\n    <summary>Weeds are one of the major reasons for crop
        yield loss but current weeding practices fail to manage weeds in an efficient
        and targeted manner. Effective weed management is especially important for
        crops with high worldwide production such as maize, to maximize crop yield
        for meeting increasing global demands. Advances in near-sensing and computer
        vision enable the development of new tools for weed management. Specifically,
        state-of-the-art segmentation models, coupled with novel sensing technologies,
        can facilitate timely and accurate weeding and monitoring systems. However,
        learning-based approaches require annotated data and show a lack of generalization
        to aerial imaging for different crops. We present a novel dataset for semantic
        and instance segmentation of crops and weeds in agricultural maize fields.
        The multispectral UAV-based dataset contains images with RGB, red-edge, and
        near-infrared bands, a large number of plant instances, dense annotations
        for maize and four weed classes, and is multitemporal. We provide extensive
        baseline results for both tasks, including probabilistic methods to quantify
        prediction uncertainty, improve model calibration, and demonstrate the approach's
        applicability to out-of-distribution data. The results show the effectiveness
        of the two additional bands compared to RGB only, and better performance in
        our target domain than models trained on existing datasets. We hope our dataset
        advances research on methods and operational systems for fine-grained weed
        identification, enhancing the robustness and applicability of UAV-based weed
        management. The dataset and code are available at https://github.com/GFZ/weedsgalore</summary>\n
        \   <category term=\"cs.CV\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <published>2025-02-18T18:13:19Z</published>\n    <arxiv:comment>11 pages,
        7 figures, 7 tables</arxiv:comment>\n    <arxiv:primary_category term=\"cs.CV\"/>\n
        \   <author>\n      <name>Ekin Celikkan</name>\n    </author>\n    <author>\n
        \     <name>Timo Kunzmann</name>\n    </author>\n    <author>\n      <name>Yertay
        Yeskaliyev</name>\n    </author>\n    <author>\n      <name>Sibylle Itzerott</name>\n
        \   </author>\n    <author>\n      <name>Nadja Klein</name>\n    </author>\n
        \   <author>\n      <name>Martin Herold</name>\n    </author>\n  </entry>\n
        \ <entry>\n    <id>http://arxiv.org/abs/2309.13578v1</id>\n    <title>A SAM-based
        Solution for Hierarchical Panoptic Segmentation of Crops and Weeds Competition</title>\n
        \   <updated>2023-09-24T08:34:12Z</updated>\n    <link href=\"https://arxiv.org/abs/2309.13578v1\"
        rel=\"alternate\" type=\"text/html\"/>\n    <link href=\"https://arxiv.org/pdf/2309.13578v1\"
        rel=\"related\" type=\"application/pdf\" title=\"pdf\"/>\n    <summary>Panoptic
        segmentation in agriculture is an advanced computer vision technique that
        provides a comprehensive understanding of field composition. It facilitates
        various tasks such as crop and weed segmentation, plant panoptic segmentation,
        and leaf instance segmentation, all aimed at addressing challenges in agriculture.
        Exploring the application of panoptic segmentation in agriculture, the 8th
        Workshop on Computer Vision in Plant Phenotyping and Agriculture (CVPPA) hosted
        the challenge of hierarchical panoptic segmentation of crops and weeds using
        the PhenoBench dataset. To tackle the tasks presented in this competition,
        we propose an approach that combines the effectiveness of the Segment AnyThing
        Model (SAM) for instance segmentation with prompt input from object detection
        models. Specifically, we integrated two notable approaches in object detection,
        namely DINO and YOLO-v8. Our best-performing model achieved a PQ+ score of
        81.33 based on the evaluation metrics of the competition.</summary>\n    <category
        term=\"cs.CV\" scheme=\"http://arxiv.org/schemas/atom\"/>\n    <published>2023-09-24T08:34:12Z</published>\n
        \   <arxiv:comment>Technical report of NYCU-WEED team for the challenge of
        hierarchical panoptic segmentation of crops and weeds using the PhenoBench
        dataset at the 8th Workshop on Computer Vision in Plant Phenotyping and Agriculture
        (CVPPA) - International Conference on Computer Vision (ICCV) 2023</arxiv:comment>\n
        \   <arxiv:primary_category term=\"cs.CV\"/>\n    <author>\n      <name>Khoa
        Dang Nguyen</name>\n    </author>\n    <author>\n      <name>Thanh-Hai Phung</name>\n
        \   </author>\n    <author>\n      <name>Hoang-Giang Cao</name>\n    </author>\n
        \ </entry>\n  <entry>\n    <id>http://arxiv.org/abs/2410.04983v2</id>\n    <title>RoWeeder:
        Unsupervised Weed Mapping through Crop-Row Detection</title>\n    <updated>2024-10-08T08:56:57Z</updated>\n
        \   <link href=\"https://arxiv.org/abs/2410.04983v2\" rel=\"alternate\" type=\"text/html\"/>\n
        \   <link href=\"https://arxiv.org/pdf/2410.04983v2\" rel=\"related\" type=\"application/pdf\"
        title=\"pdf\"/>\n    <summary>Precision agriculture relies heavily on effective
        weed management to ensure robust crop yields. This study presents RoWeeder,
        an innovative framework for unsupervised weed mapping that combines crop-row
        detection with a noise-resilient deep learning model. By leveraging crop-row
        information to create a pseudo-ground truth, our method trains a lightweight
        deep learning model capable of distinguishing between crops and weeds, even
        in the presence of noisy data. Evaluated on the WeedMap dataset, RoWeeder
        achieves an F1 score of 75.3, outperforming several baselines. Comprehensive
        ablation studies further validated the model's performance. By integrating
        RoWeeder with drone technology, farmers can conduct real-time aerial surveys,
        enabling precise weed management across large fields. The code is available
        at: \\url{https://github.com/pasqualedem/RoWeeder}.</summary>\n    <category
        term=\"cs.CV\" scheme=\"http://arxiv.org/schemas/atom\"/>\n    <published>2024-10-07T12:26:22Z</published>\n
        \   <arxiv:comment>Computer Vision for Plant Phenotyping and Agriculture (CVPPA)
        workshop at ECCV 2024</arxiv:comment>\n    <arxiv:primary_category term=\"cs.CV\"/>\n
        \   <author>\n      <name>Pasquale De Marinis</name>\n    </author>\n    <author>\n
        \     <name>Gennaro Vessio</name>\n    </author>\n    <author>\n      <name>Giovanna
        Castellano</name>\n    </author>\n  </entry>\n  <entry>\n    <id>http://arxiv.org/abs/2010.14708v2</id>\n
        \   <title>Crop and weed classification based on AutoML</title>\n    <updated>2022-03-28T07:59:27Z</updated>\n
        \   <link href=\"https://arxiv.org/abs/2010.14708v2\" rel=\"alternate\" type=\"text/html\"/>\n
        \   <link href=\"https://arxiv.org/pdf/2010.14708v2\" rel=\"related\" type=\"application/pdf\"
        title=\"pdf\"/>\n    <summary>CNN models already play an important role in
        classification of crop and weed with high accuracy, more than 95% as reported
        in literature. However, to manually choose and fine-tune the deep learning
        models becomes laborious and indispensable in most traditional practices and
        research. Moreover, the classic objective functions are not thoroughly compatible
        with agricultural farming tasks as the corresponding models suffer from misclassifying
        crop to weed, often more likely than in other deep learning application domains.
        In this paper, we applied autonomous machine learning with a new objective
        function for crop and weed classification, achieving higher accuracy and lower
        crop killing rate (rate of identifying a crop as a weed). The experimental
        results show that our method outperforms state-of-the-art applications, for
        example, ResNet and VGG19.</summary>\n    <category term=\"cs.AI\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <category term=\"cs.LG\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <published>2020-10-28T02:35:17Z</published>\n    <arxiv:primary_category
        term=\"cs.AI\"/>\n    <arxiv:journal_ref>J. Applied Computing and Intelligence,
        2021, 1(1): 46-60</arxiv:journal_ref>\n    <author>\n      <name>Xuetao Jiang</name>\n
        \   </author>\n    <author>\n      <name>Binbin Yong</name>\n    </author>\n
        \   <author>\n      <name>Soheila Garshasbi</name>\n    </author>\n    <author>\n
        \     <name>Jun Shen</name>\n    </author>\n    <author>\n      <name>Meiyu
        Jiang</name>\n    </author>\n    <author>\n      <name>Qingguo Zhou</name>\n
        \   </author>\n    <arxiv:doi>10.3934/aci.2021003</arxiv:doi>\n    <link rel=\"related\"
        href=\"https://doi.org/10.3934/aci.2021003\" title=\"doi\"/>\n  </entry>\n
        \ <entry>\n    <id>http://arxiv.org/abs/2601.13196v1</id>\n    <title>Active
        Informative Planning for UAV-based Weed Mapping using Discrete Gaussian Process
        Representations</title>\n    <updated>2026-01-19T16:20:27Z</updated>\n    <link
        href=\"https://arxiv.org/abs/2601.13196v1\" rel=\"alternate\" type=\"text/html\"/>\n
        \   <link href=\"https://arxiv.org/pdf/2601.13196v1\" rel=\"related\" type=\"application/pdf\"
        title=\"pdf\"/>\n    <summary>Accurate agricultural weed mapping using unmanned
        aerial vehicles (UAVs) is crucial for precision farming. While traditional
        methods rely on rigid, pre-defined flight paths and intensive offline processing,
        informative path planning (IPP) offers a way to collect data adaptively where
        it is most needed. Gaussian process (GP) mapping provides a continuous model
        of weed distribution with built-in uncertainty. However, GPs must be discretised
        for practical use in autonomous planning. Many discretisation techniques exist,
        but the impact of discrete representation choice remains poorly understood.
        This paper investigates how different discrete GP representations influence
        both mapping quality and mission-level performance in UAV-based weed mapping.
        Considering a UAV equipped with a downward-facing camera, we implement a receding-horizon
        IPP strategy that selects sampling locations based on the map uncertainty,
        travel cost, and coverage penalties. We investigate multiple discretisation
        strategies for representing the GP posterior and use their induced map partitions
        to generate candidate viewpoints for planning. Experiments on real-world weed
        distributions show that representation choice significantly affects exploration
        behaviour and efficiency. Overall, our results demonstrate that discretisation
        is not only a representational detail but a key design choice that shapes
        planning dynamics, coverage efficiency, and computational load in online UAV
        weed mapping.</summary>\n    <category term=\"cs.RO\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <published>2026-01-19T16:20:27Z</published>\n    <arxiv:primary_category
        term=\"cs.RO\"/>\n    <author>\n      <name>Jacob Swindell</name>\n    </author>\n
        \   <author>\n      <name>Marija Popovi\u0107</name>\n    </author>\n    <author>\n
        \     <name>Riccardo Polvara</name>\n    </author>\n  </entry>\n  <entry>\n
        \   <id>http://arxiv.org/abs/2109.02716v2</id>\n    <title>Vision Transformers
        For Weeds and Crops Classification Of High Resolution UAV Images</title>\n
        \   <updated>2021-10-22T08:34:08Z</updated>\n    <link href=\"https://arxiv.org/abs/2109.02716v2\"
        rel=\"alternate\" type=\"text/html\"/>\n    <link href=\"https://arxiv.org/pdf/2109.02716v2\"
        rel=\"related\" type=\"application/pdf\" title=\"pdf\"/>\n    <summary>Crop
        and weed monitoring is an important challenge for agriculture and food production
        nowadays. Thanks to recent advances in data acquisition and computation technologies,
        agriculture is evolving to a more smart and precision farming to meet with
        the high yield and high quality crop production. Classification and recognition
        in Unmanned Aerial Vehicles (UAV) images are important phases for crop monitoring.
        Advances in deep learning models relying on Convolutional Neural Network (CNN)
        have achieved high performances in image classification in the agricultural
        domain. Despite the success of this architecture, CNN still faces many challenges
        such as high computation cost, the need of large labelled datasets, ... Natural
        language processing's transformer architecture can be an alternative approach
        to deal with CNN's limitations. Making use of the self-attention paradigm,
        Vision Transformer (ViT) models can achieve competitive or better results
        without applying any convolution operations. In this paper, we adopt the self-attention
        mechanism via the ViT models for plant classification of weeds and crops:
        red beet, off-type beet (green leaves), parsley and spinach. Our experiments
        show that with small set of labelled training data, ViT models perform better
        compared to state-of-the-art CNN-based models EfficientNet and ResNet, with
        a top accuracy of 99.8\\% achieved by the ViT model.</summary>\n    <category
        term=\"cs.CV\" scheme=\"http://arxiv.org/schemas/atom\"/>\n    <published>2021-09-06T19:58:54Z</published>\n
        \   <arxiv:comment>Compared to the last version of the article, we have added
        some experiments, that is the evaluation of the performances by varying the
        number of samples in the test and train sets</arxiv:comment>\n    <arxiv:primary_category
        term=\"cs.CV\"/>\n    <author>\n      <name>Reenul Reedha</name>\n    </author>\n
        \   <author>\n      <name>Eric Dericquebourg</name>\n    </author>\n    <author>\n
        \     <name>Raphael Canals</name>\n    </author>\n    <author>\n      <name>Adel
        Hafiane</name>\n    </author>\n    <arxiv:doi>10.3390/rs14030592</arxiv:doi>\n
        \   <link rel=\"related\" href=\"https://doi.org/10.3390/rs14030592\" title=\"doi\"/>\n
        \ </entry>\n  <entry>\n    <id>http://arxiv.org/abs/2011.02193v2</id>\n    <title>Weed
        Density and Distribution Estimation for Precision Agriculture using Semi-Supervised
        Learning</title>\n    <updated>2021-02-18T14:05:01Z</updated>\n    <link href=\"https://arxiv.org/abs/2011.02193v2\"
        rel=\"alternate\" type=\"text/html\"/>\n    <link href=\"https://arxiv.org/pdf/2011.02193v2\"
        rel=\"related\" type=\"application/pdf\" title=\"pdf\"/>\n    <summary>Uncontrolled
        growth of weeds can severely affect the crop yield and quality. Unrestricted
        use of herbicide for weed removal alters biodiversity and cause environmental
        pollution. Instead, identifying weed-infested regions can aid selective chemical
        treatment of these regions. Advances in analyzing farm images have resulted
        in solutions to identify weed plants. However, a majority of these approaches
        are based on supervised learning methods which requires huge amount of manually
        annotated images. As a result, these supervised approaches are economically
        infeasible for the individual farmer because of the wide variety of plant
        species being cultivated. In this paper, we propose a deep learning-based
        semi-supervised approach for robust estimation of weed density and distribution
        across farmlands using only limited color images acquired from autonomous
        robots. This weed density and distribution can be useful in a site-specific
        weed management system for selective treatment of infected areas using autonomous
        robots. In this work, the foreground vegetation pixels containing crops and
        weeds are first identified using a Convolutional Neural Network (CNN) based
        unsupervised segmentation. Subsequently, the weed infected regions are identified
        using a fine-tuned CNN, eliminating the need for designing hand-crafted features.
        The approach is validated on two datasets of different crop/weed species (1)
        Crop Weed Field Image Dataset (CWFID), which consists of carrot plant images
        and the (2) Sugar Beets dataset. The proposed method is able to localize weed-infested
        regions a maximum recall of 0.99 and estimate weed density with a maximum
        accuracy of 82.13%. Hence, the proposed approach is shown to generalize to
        different plant species without the need for extensive labeled data.</summary>\n
        \   <category term=\"cs.CV\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <category term=\"cs.RO\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <published>2020-11-04T09:35:53Z</published>\n    <arxiv:comment>Included
        few details about the dataset. This paper has been accepted in IEEE Access.
        Citation: S. Shorewala, A. Ashfaque, S. R and U. Verma, \"Weed Density and
        Distribution Estimation for Precision Agriculture using Semi-Supervised Learning,\"
        in IEEE Access, doi: 10.1109/ACCESS.2021.3057912</arxiv:comment>\n    <arxiv:primary_category
        term=\"cs.CV\"/>\n    <arxiv:journal_ref>IEEE Access, vol 9, 2021</arxiv:journal_ref>\n
        \   <author>\n      <name>Shantam Shorewala</name>\n    </author>\n    <author>\n
        \     <name>Armaan Ashfaque</name>\n    </author>\n    <author>\n      <name>Sidharth
        R</name>\n    </author>\n    <author>\n      <name>Ujjwal Verma</name>\n    </author>\n
        \   <arxiv:doi>10.1109/ACCESS.2021.3057912</arxiv:doi>\n    <link rel=\"related\"
        href=\"https://doi.org/10.1109/ACCESS.2021.3057912\" title=\"doi\"/>\n  </entry>\n
        \ <entry>\n    <id>http://arxiv.org/abs/2106.10581v1</id>\n    <title>Supervised
        learning for crop/weed classification based on color and texture features</title>\n
        \   <updated>2021-06-19T22:31:54Z</updated>\n    <link href=\"https://arxiv.org/abs/2106.10581v1\"
        rel=\"alternate\" type=\"text/html\"/>\n    <link href=\"https://arxiv.org/pdf/2106.10581v1\"
        rel=\"related\" type=\"application/pdf\" title=\"pdf\"/>\n    <summary>Computer
        vision techniques have attracted a great interest in precision agriculture,
        recently. The common goal of all computer vision-based precision agriculture
        tasks is to detect the objects of interest (e.g., crop, weed) and discriminating
        them from the background. The Weeds are unwanted plants growing among crops
        competing for nutrients, water, and sunlight, causing losses to crop yields.
        Weed detection and mapping is critical for site-specific weed management to
        reduce the cost of labor and impact of herbicides. This paper investigates
        the use of color and texture features for discrimination of Soybean crops
        and weeds. Feature extraction methods including two color spaces (RGB, HSV),
        gray level Co-occurrence matrix (GLCM), and Local Binary Pattern (LBP) are
        used to train the Support Vector Machine (SVM) classifier. The experiment
        was carried out on image dataset of soybean crop, obtained from an unmanned
        aerial vehicle (UAV), which is publicly available. The results from the experiment
        showed that the highest accuracy (above 96%) was obtained from the combination
        of color and LBP features.</summary>\n    <category term=\"cs.CV\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <published>2021-06-19T22:31:54Z</published>\n    <arxiv:primary_category
        term=\"cs.CV\"/>\n    <author>\n      <name>Faiza Mekhalfa</name>\n    </author>\n
        \   <author>\n      <name>Fouad Yacef</name>\n    </author>\n  </entry>\n
        \ <entry>\n    <id>http://arxiv.org/abs/2307.12588v2</id>\n    <title>BonnBot-I:
        A Precise Weed Management and Crop Monitoring Platform</title>\n    <updated>2024-12-03T07:45:34Z</updated>\n
        \   <link href=\"https://arxiv.org/abs/2307.12588v2\" rel=\"alternate\" type=\"text/html\"/>\n
        \   <link href=\"https://arxiv.org/pdf/2307.12588v2\" rel=\"related\" type=\"application/pdf\"
        title=\"pdf\"/>\n    <summary>Cultivation and weeding are two of the primary
        tasks performed by farmers today. A recent challenge for weeding is the desire
        to reduce herbicide and pesticide treatments while maintaining crop quality
        and quantity. In this paper, we introduce BonnBot-I a precise weed management
        platform which can also performs field monitoring. Driven by crop monitoring
        approaches that can accurately locate and classify plants (weed and crop)
        we further improve their performance by fusing the platform available GNSS
        and wheel odometry. This improves the tracking accuracy of our crop monitoring
        approach from a normalized average error of 8.3% to 3.5%, evaluated on a new
        publicly available corn dataset. We also present a novel arrangement of weeding
        tools mounted on linear actuators evaluated in simulated environments. We
        replicate weed distributions from a real field, using the results from our
        monitoring approach, and show the validity of our work-space division techniques
        which require significantly less movement (a 50% reduction) to achieve similar
        results. Overall, BonnBot-I is a significant step forward in precise weed
        management with a novel method of selectively spraying and controlling weeds
        in an arable field.</summary>\n    <category term=\"cs.RO\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <category term=\"cs.AR\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <category term=\"cs.MA\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <category term=\"eess.SY\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <published>2023-07-24T07:59:54Z</published>\n    <arxiv:comment>2022 IEEE/RSJ
        International Conference on Intelligent Robots and Systems (IROS)</arxiv:comment>\n
        \   <arxiv:primary_category term=\"cs.RO\"/>\n    <author>\n      <name>Alireza
        Ahmadi</name>\n    </author>\n    <author>\n      <name>Michael Halstead</name>\n
        \   </author>\n    <author>\n      <name>Chris McCool</name>\n    </author>\n
        \ </entry>\n  <entry>\n    <id>http://arxiv.org/abs/1806.03412v1</id>\n    <title>Fully
        Convolutional Networks with Sequential Information for Robust Crop and Weed
        Detection in Precision Farming</title>\n    <updated>2018-06-09T04:56:01Z</updated>\n
        \   <link href=\"https://arxiv.org/abs/1806.03412v1\" rel=\"alternate\" type=\"text/html\"/>\n
        \   <link href=\"https://arxiv.org/pdf/1806.03412v1\" rel=\"related\" type=\"application/pdf\"
        title=\"pdf\"/>\n    <summary>Reducing the use of agrochemicals is an important
        component towards sustainable agriculture. Robots that can perform targeted
        weed control offer the potential to contribute to this goal, for example,
        through specialized weeding actions such as selective spraying or mechanical
        weed removal. A prerequisite of such systems is a reliable and robust plant
        classification system that is able to distinguish crop and weed in the field.
        A major challenge in this context is the fact that different fields show a
        large variability. Thus, classification systems have to robustly cope with
        substantial environmental changes with respect to weed pressure and weed types,
        growth stages of the crop, visual appearance, and soil conditions. In this
        paper, we propose a novel crop-weed classification system that relies on a
        fully convolutional network with an encoder-decoder structure and incorporates
        spatial information by considering image sequences. Exploiting the crop arrangement
        information that is observable from the image sequences enables our system
        to robustly estimate a pixel-wise labeling of the images into crop and weed,
        i.e., a semantic segmentation. We provide a thorough experimental evaluation,
        which shows that our system generalizes well to previously unseen fields under
        varying environmental conditions --- a key capability to actually use such
        systems in precision framing. We provide comparisons to other state-of-the-art
        approaches and show that our system substantially improves the accuracy of
        crop-weed classification without requiring a retraining of the model.</summary>\n
        \   <category term=\"cs.CV\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <published>2018-06-09T04:56:01Z</published>\n    <arxiv:comment>Accepted
        for publication in IEEE Robotics and Automation Letters (RA-L), 2018</arxiv:comment>\n
        \   <arxiv:primary_category term=\"cs.CV\"/>\n    <author>\n      <name>Philipp
        Lottes</name>\n    </author>\n    <author>\n      <name>Jens Behley</name>\n
        \   </author>\n    <author>\n      <name>Andres Milioto</name>\n    </author>\n
        \   <author>\n      <name>Cyrill Stachniss</name>\n    </author>\n    <arxiv:doi>10.1109/LRA.2018.2846289</arxiv:doi>\n
        \   <link rel=\"related\" href=\"https://doi.org/10.1109/LRA.2018.2846289\"
        title=\"doi\"/>\n  </entry>\n  <entry>\n    <id>http://arxiv.org/abs/2112.07819v1</id>\n
        \   <title>Weed Recognition using Deep Learning Techniques on Class-imbalanced
        Imagery</title>\n    <updated>2021-12-15T01:00:05Z</updated>\n    <link href=\"https://arxiv.org/abs/2112.07819v1\"
        rel=\"alternate\" type=\"text/html\"/>\n    <link href=\"https://arxiv.org/pdf/2112.07819v1\"
        rel=\"related\" type=\"application/pdf\" title=\"pdf\"/>\n    <summary>Most
        weed species can adversely impact agricultural productivity by competing for
        nutrients required by high-value crops. Manual weeding is not practical for
        large cropping areas. Many studies have been undertaken to develop automatic
        weed management systems for agricultural crops. In this process, one of the
        major tasks is to recognise the weeds from images. However, weed recognition
        is a challenging task. It is because weed and crop plants can be similar in
        colour, texture and shape which can be exacerbated further by the imaging
        conditions, geographic or weather conditions when the images are recorded.
        Advanced machine learning techniques can be used to recognise weeds from imagery.
        In this paper, we have investigated five state-of-the-art deep neural networks,
        namely VGG16, ResNet-50, Inception-V3, Inception-ResNet-v2 and MobileNetV2,
        and evaluated their performance for weed recognition. We have used several
        experimental settings and multiple dataset combinations. In particular, we
        constructed a large weed-crop dataset by combining several smaller datasets,
        mitigating class imbalance by data augmentation, and using this dataset in
        benchmarking the deep neural networks. We investigated the use of transfer
        learning techniques by preserving the pre-trained weights for extracting the
        features and fine-tuning them using the images of crop and weed datasets.
        We found that VGG16 performed better than others on small-scale datasets,
        while ResNet-50 performed better than other deep networks on the large combined
        dataset.</summary>\n    <category term=\"cs.CV\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <category term=\"cs.AI\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <published>2021-12-15T01:00:05Z</published>\n    <arxiv:comment>The paper
        is accepted by Crop and Pasture Science journal (https://www.publish.csiro.au/CP/justaccepted/CP21626)</arxiv:comment>\n
        \   <arxiv:primary_category term=\"cs.CV\"/>\n    <author>\n      <name>A
        S M Mahmudul Hasan</name>\n    </author>\n    <author>\n      <name>Ferdous
        Sohel</name>\n    </author>\n    <author>\n      <name>Dean Diepeveen</name>\n
        \   </author>\n    <author>\n      <name>Hamid Laga</name>\n    </author>\n
        \   <author>\n      <name>Michael G. K. Jones</name>\n    </author>\n  </entry>\n
        \ <entry>\n    <id>http://arxiv.org/abs/2610.24893v1</id>\n    <title>Multi-Speed
        Field Evaluation of a Semi-Autonomous Precision Sprayer for Weed Control in
        Vegetable Crops</title>\n    <updated>2026-10-17T22:31:01Z</updated>\n    <link
        href=\"https://arxiv.org/abs/2610.24893v1\" rel=\"alternate\" type=\"text/html\"/>\n
        \   <link href=\"https://arxiv.org/pdf/2610.24893v1\" rel=\"related\" type=\"application/pdf\"
        title=\"pdf\"/>\n    <summary>Machine vision-guided precision spraying is
        promising for sustainable vegetable production by enabling site-specific weed
        targeting, reducing herbicide application while protecting crop yield and
        quality. However, the effects of operating speed of sprayer systems on the
        integrated detection-tracking-actuation pipeline remain insufficiently characterized
        under field conditions. This study evaluated a semi-autonomous, tractor-based
        spraying system for targeted weed control in radish and quantified performance
        across three operating speeds. A five-season dataset comprising 10,599 images
        and 84,311 annotated instances across seven classes was curated for model
        development. A YOLOv11-medium model was integrated with ByteTrack tracking
        and a customized 12-nozzle sprayer on a semi-autonomous electric tractor.
        Field trials were conducted at 0.13, 0.27, and 0.45 m/s (i.e., 0.3, 0.6, and
        1.0 mph) to characterize speed-dependent changes in weed detection, targeting,
        actuation, and crop damage. At the lowest speed of 0.13 m/s, the system achieved
        94.6% mAP@50 and 93.2% recall for weed and crop detection. However, increasing
        platform speed substantially reduced system performance, with weed hit rate
        declining from 78.3% to 35.0% and crop contact rates increasing from 20.1%
        to 28.7%. Consequently, the system did not meet predefined commercial-viability
        thresholds. These results demonstrate that practical deployment requires improvements
        beyond weed detection alone, particularly coordinated improvements in motion-robust
        plant perception, spray-timing compensation, and crop-adjacent actuation precision.
        The identified performance bottlenecks provide specific engineering targets
        for advancing vision-guided precision spraying toward practical, high-speed
        vegetable weed management. The software programs developed in this study have
        been made publicly available to support future precision weeding research.</summary>\n
        \   <category term=\"cs.CV\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <published>2026-10-17T22:31:01Z</published>\n    <arxiv:comment>16 pages,
        5 figures, 7 tables</arxiv:comment>\n    <arxiv:primary_category term=\"cs.CV\"/>\n
        \   <author>\n      <name>Md Khairul Islam</name>\n    </author>\n    <author>\n
        \     <name>Boyang Deng</name>\n    </author>\n    <author>\n      <name>Yuzhen
        Lu</name>\n    </author>\n    <author>\n      <name>Daniel Brainard</name>\n
        \   </author>\n    <author>\n      <name>Ajit Srivastava</name>\n    </author>\n
        \ </entry>\n  <entry>\n    <id>http://arxiv.org/abs/2310.01055v3</id>\n    <title>Improved
        Crop and Weed Detection with Diverse Data Ensemble Learning</title>\n    <updated>2024-06-14T06:26:48Z</updated>\n
        \   <link href=\"https://arxiv.org/abs/2310.01055v3\" rel=\"alternate\" type=\"text/html\"/>\n
        \   <link href=\"https://arxiv.org/pdf/2310.01055v3\" rel=\"related\" type=\"application/pdf\"
        title=\"pdf\"/>\n    <summary>Modern agriculture heavily relies on Site-Specific
        Farm Management practices, necessitating accurate detection, localization,
        and quantification of crops and weeds in the field, which can be achieved
        using deep learning techniques. In this regard, crop and weed-specific binary
        segmentation models have shown promise. However, uncontrolled field conditions
        limit their performance from one field to the other. To improve semantic model
        generalization, existing methods augment and synthesize agricultural data
        to account for uncontrolled field conditions. However, given highly varied
        field conditions, these methods have limitations. To overcome the challenges
        of model deterioration in such conditions, we propose utilizing data specific
        to other crops and weeds for our specific target problem. To achieve this,
        we propose a novel ensemble framework. Our approach involves utilizing different
        crop and weed models trained on diverse datasets and employing a teacher-student
        configuration. By using homogeneous stacking of base models and a trainable
        meta-architecture to combine their outputs, we achieve significant improvements
        for Canola crops and Kochia weeds on unseen test data, surpassing the performance
        of single semantic segmentation models. We identify the UNET meta-architecture
        as the most effective in this context. Finally, through ablation studies,
        we demonstrate and validate the effectiveness of our proposed model. We observe
        that including base models trained on other target crops and weeds can help
        generalize the model to capture varied field conditions. Lastly, we propose
        two novel datasets with varied conditions for comparisons.</summary>\n    <category
        term=\"cs.CV\" scheme=\"http://arxiv.org/schemas/atom\"/>\n    <category term=\"cs.AI\"
        scheme=\"http://arxiv.org/schemas/atom\"/>\n    <category term=\"cs.LG\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <published>2023-10-02T10:05:30Z</published>\n    <arxiv:comment>Accepted
        in CVPR Workshop as an Oral</arxiv:comment>\n    <arxiv:primary_category term=\"cs.CV\"/>\n
        \   <author>\n      <name>Muhammad Hamza Asad</name>\n    </author>\n    <author>\n
        \     <name>Saeed Anwar</name>\n    </author>\n    <author>\n      <name>Abdul
        Bais</name>\n    </author>\n  </entry>\n  <entry>\n    <id>http://arxiv.org/abs/1806.03413v1</id>\n
        \   <title>Joint Stem Detection and Crop-Weed Classification for Plant-specific
        Treatment in Precision Farming</title>\n    <updated>2018-06-09T04:56:07Z</updated>\n
        \   <link href=\"https://arxiv.org/abs/1806.03413v1\" rel=\"alternate\" type=\"text/html\"/>\n
        \   <link href=\"https://arxiv.org/pdf/1806.03413v1\" rel=\"related\" type=\"application/pdf\"
        title=\"pdf\"/>\n    <summary>Applying agrochemicals is the default procedure
        for conventional weed control in crop production, but has negative impacts
        on the environment. Robots have the potential to treat every plant in the
        field individually and thus can reduce the required use of such chemicals.
        To achieve that, robots need the ability to identify crops and weeds in the
        field and must additionally select effective treatments. While certain types
        of weed can be treated mechanically, other types need to be treated by (selective)
        spraying. In this paper, we present an approach that provides the necessary
        information for effective plant-specific treatment. It outputs the stem location
        for weeds, which allows for mechanical treatments, and the covered area of
        the weed for selective spraying. Our approach uses an end-to-end trainable
        fully convolutional network that simultaneously estimates stem positions as
        well as the covered area of crops and weeds. It jointly learns the class-wise
        stem detection and the pixel-wise semantic segmentation. Experimental evaluations
        on different real-world datasets show that our approach is able to reliably
        solve this problem. Compared to state-of-the-art approaches, our approach
        not only substantially improves the stem detection accuracy, i.e., distinguishing
        crop and weed stems, but also provides an improvement in the semantic segmentation
        performance.</summary>\n    <category term=\"cs.CV\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <published>2018-06-09T04:56:07Z</published>\n    <arxiv:comment>Submitted
        to the International Conference on Intelligent Robots and Systems (IROS),
        2018</arxiv:comment>\n    <arxiv:primary_category term=\"cs.CV\"/>\n    <author>\n
        \     <name>Philipp Lottes</name>\n    </author>\n    <author>\n      <name>Jens
        Behley</name>\n    </author>\n    <author>\n      <name>Nived Chebrolu</name>\n
        \   </author>\n    <author>\n      <name>Andres Milioto</name>\n    </author>\n
        \   <author>\n      <name>Cyrill Stachniss</name>\n    </author>\n  </entry>\n
        \ <entry>\n    <id>http://arxiv.org/abs/2305.10084v1</id>\n    <title>CWD30:
        A Comprehensive and Holistic Dataset for Crop Weed Recognition in Precision
        Agriculture</title>\n    <updated>2023-05-17T09:39:01Z</updated>\n    <link
        href=\"https://arxiv.org/abs/2305.10084v1\" rel=\"alternate\" type=\"text/html\"/>\n
        \   <link href=\"https://arxiv.org/pdf/2305.10084v1\" rel=\"related\" type=\"application/pdf\"
        title=\"pdf\"/>\n    <summary>The growing demand for precision agriculture
        necessitates efficient and accurate crop-weed recognition and classification
        systems. Current datasets often lack the sample size, diversity, and hierarchical
        structure needed to develop robust deep learning models for discriminating
        crops and weeds in agricultural fields. Moreover, the similar external structure
        and phenomics of crops and weeds complicate recognition tasks. To address
        these issues, we present the CWD30 dataset, a large-scale, diverse, holistic,
        and hierarchical dataset tailored for crop-weed recognition tasks in precision
        agriculture. CWD30 comprises over 219,770 high-resolution images of 20 weed
        species and 10 crop species, encompassing various growth stages, multiple
        viewing angles, and environmental conditions. The images were collected from
        diverse agricultural fields across different geographic locations and seasons,
        ensuring a representative dataset. The dataset's hierarchical taxonomy enables
        fine-grained classification and facilitates the development of more accurate,
        robust, and generalizable deep learning models. We conduct extensive baseline
        experiments to validate the efficacy of the CWD30 dataset. Our experiments
        reveal that the dataset poses significant challenges due to intra-class variations,
        inter-class similarities, and data imbalance. Additionally, we demonstrate
        that minor training modifications like using CWD30 pretrained backbones can
        significantly enhance model performance and reduce convergence time, saving
        training resources on several downstream tasks. These challenges provide valuable
        insights and opportunities for future research in crop-weed recognition. We
        believe that the CWD30 dataset will serve as a benchmark for evaluating crop-weed
        recognition algorithms, promoting advancements in precision agriculture, and
        fostering collaboration among researchers in the field.</summary>\n    <category
        term=\"cs.CV\" scheme=\"http://arxiv.org/schemas/atom\"/>\n    <published>2023-05-17T09:39:01Z</published>\n
        \   <arxiv:comment>15 pages, 14 figures, journal research article</arxiv:comment>\n
        \   <arxiv:primary_category term=\"cs.CV\"/>\n    <arxiv:journal_ref>Computers
        and Electronics in Agriculture 229 (2025): 109737</arxiv:journal_ref>\n    <author>\n
        \     <name>Talha Ilyas</name>\n    </author>\n    <author>\n      <name>Dewa
        Made Sri Arsa</name>\n    </author>\n    <author>\n      <name>Khubaib Ahmad</name>\n
        \   </author>\n    <author>\n      <name>Yong Chae Jeong</name>\n    </author>\n
        \   <author>\n      <name>Okjae Won</name>\n    </author>\n    <author>\n
        \     <name>Jong Hoon Lee</name>\n    </author>\n    <author>\n      <name>Hyongsuk
        Kim</name>\n    </author>\n    <arxiv:doi>10.1016/j.compag.2024.109737</arxiv:doi>\n
        \   <link rel=\"related\" href=\"https://doi.org/10.1016/j.compag.2024.109737\"
        title=\"doi\"/>\n  </entry>\n  <entry>\n    <id>http://arxiv.org/abs/2203.11766v1</id>\n
        \   <title>Monitoring and mapping of crop fields with UAV swarms based on
        information gain</title>\n    <updated>2022-03-22T14:28:58Z</updated>\n    <link
        href=\"https://arxiv.org/abs/2203.11766v1\" rel=\"alternate\" type=\"text/html\"/>\n
        \   <link href=\"https://arxiv.org/pdf/2203.11766v1\" rel=\"related\" type=\"application/pdf\"
        title=\"pdf\"/>\n    <summary>Monitoring crop fields to map features like
        weeds can be efficiently performed with unmanned aerial vehicles (UAVs) that
        can cover large areas in a short time due to their privileged perspective
        and motion speed. However, the need for high-resolution images for precise
        classification of features (e.g., detecting even the smallest weeds in the
        field) contrasts with the limited payload and ight time of current UAVs. Thus,
        it requires several flights to cover a large field uniformly. However, the
        assumption that the whole field must be observed with the same precision is
        unnecessary when features are heterogeneously distributed, like weeds appearing
        in patches over the field. In this case, an adaptive approach that focuses
        only on relevant areas can perform better, especially when multiple UAVs are
        employed simultaneously. Leveraging on a swarm-robotics approach, we propose
        a monitoring and mapping strategy that adaptively chooses the target areas
        based on the expected information gain, which measures the potential for uncertainty
        reduction due to further observations. The proposed strategy scales well with
        group size and leads to smaller mapping errors than optimal pre-planned monitoring
        approaches.</summary>\n    <category term=\"cs.RO\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <published>2022-03-22T14:28:58Z</published>\n    <arxiv:primary_category
        term=\"cs.RO\"/>\n    <author>\n      <name>Carlos Carbone</name>\n    </author>\n
        \   <author>\n      <name>Dario Albani</name>\n    </author>\n    <author>\n
        \     <name>Federico Magistri</name>\n    </author>\n    <author>\n      <name>Dimitri
        Ognibene</name>\n    </author>\n    <author>\n      <name>Cyrill Stachniss</name>\n
        \   </author>\n    <author>\n      <name>Gert Kootstra</name>\n    </author>\n
        \   <author>\n      <name>Daniele Nardi</name>\n    </author>\n    <author>\n
        \     <name>Vito Trianni</name>\n    </author>\n    <arxiv:doi>10.1007/978-3-030-92790-5_24</arxiv:doi>\n
        \   <link rel=\"related\" href=\"https://doi.org/10.1007/978-3-030-92790-5_24\"
        title=\"doi\"/>\n  </entry>\n  <entry>\n    <id>http://arxiv.org/abs/1807.00035v1</id>\n
        \   <title>An Efficient Data Warehouse for Crop Yield Prediction</title>\n
        \   <updated>2018-06-26T15:51:30Z</updated>\n    <link href=\"https://arxiv.org/abs/1807.00035v1\"
        rel=\"alternate\" type=\"text/html\"/>\n    <link href=\"https://arxiv.org/pdf/1807.00035v1\"
        rel=\"related\" type=\"application/pdf\" title=\"pdf\"/>\n    <summary>Nowadays,
        precision agriculture combined with modern information and communications
        technologies, is becoming more common in agricultural activities such as automated
        irrigation systems, precision planting, variable rate applications of nutrients
        and pesticides, and agricultural decision support systems. In the latter,
        crop management data analysis, based on machine learning and data mining,
        focuses mainly on how to efficiently forecast and improve crop yield. In recent
        years, raw and semi-processed agricultural data are usually collected using
        sensors, robots, satellites, weather stations, farm equipment, farmers and
        agribusinesses while the Internet of Things (IoT) should deliver the promise
        of wirelessly connecting objects and devices in the agricultural ecosystem.
        Agricultural data typically captures information about farming entities and
        operations. Every farming entity encapsulates an individual farming concept,
        such as field, crop, seed, soil, temperature, humidity, pest, and weed. Agricultural
        datasets are spatial, temporal, complex, heterogeneous, non-standardized,
        and very large. In particular, agricultural data is considered as Big Data
        in terms of volume, variety, velocity and veracity. Designing and developing
        a data warehouse for precision agriculture is a key foundation for establishing
        a crop intelligence platform, which will enable resource efficient agronomy
        decision making and recommendations. Some of the requirements for such an
        agricultural data warehouse are privacy, security, and real-time access among
        its stakeholders (e.g., farmers, farm equipment manufacturers, agribusinesses,
        co-operative societies, customers and possibly Government agencies). However,
        currently there are very few reports in the literature that focus on the design
        of efficient data warehouses with the view of enabling Agricultural Big Data
        analysis and data mining. In this paper ...</summary>\n    <category term=\"cs.CY\"
        scheme=\"http://arxiv.org/schemas/atom\"/>\n    <category term=\"cs.DB\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <published>2018-06-26T15:51:30Z</published>\n    <arxiv:comment>12 pages.
        Keywords. Data warehouse, constellation schema, crop yield prediction, precision
        agriculture</arxiv:comment>\n    <arxiv:primary_category term=\"cs.CY\"/>\n
        \   <arxiv:journal_ref>Proceedings of the 14th International Conference on
        Precision Agriculture. June 24 to June 27, 2018, Montreal, Quebec, Canada</arxiv:journal_ref>\n
        \   <author>\n      <name>Vuong M. Ngo</name>\n    </author>\n    <author>\n
        \     <name>Nhien-An Le-Khac</name>\n    </author>\n    <author>\n      <name>M-Tahar
        Kechadi</name>\n    </author>\n  </entry>\n  <entry>\n    <id>http://arxiv.org/abs/2503.07210v1</id>\n
        \   <title>Discrete Gaussian Process Representations for Optimising UAV-based
        Precision Weed Mapping</title>\n    <updated>2025-03-10T11:50:15Z</updated>\n
        \   <link href=\"https://arxiv.org/abs/2503.07210v1\" rel=\"alternate\" type=\"text/html\"/>\n
        \   <link href=\"https://arxiv.org/pdf/2503.07210v1\" rel=\"related\" type=\"application/pdf\"
        title=\"pdf\"/>\n    <summary>Accurate agricultural weed mapping using UAVs
        is crucial for precision farming applications. Traditional methods rely on
        orthomosaic stitching from rigid flight paths, which is computationally intensive
        and time-consuming. Gaussian Process (GP)-based mapping offers continuous
        modelling of the underlying variable (i.e. weed distribution) but requires
        discretisation for practical tasks like path planning or visualisation. Current
        implementations often default to quadtrees or gridmaps without systematically
        evaluating alternatives. This study compares five discretisation methods:
        quadtrees, wedgelets, top-down binary space partition (BSP) trees using least
        square error (LSE), bottom-up BSP trees using graph merging, and variable-resolution
        hexagonal grids. Evaluations on real-world weed distributions measure visual
        similarity, mean squared error (MSE), and computational efficiency. Results
        show quadtrees perform best overall, but alternatives excel in specific scenarios:
        hexagons or BSP LSE suit fields with large, dominant weed patches, while quadtrees
        are optimal for dispersed small-scale distributions. These findings highlight
        the need to tailor discretisation approaches to weed distribution patterns
        (patch size, density, coverage) rather than relying on default methods. By
        choosing representations based on the underlying distribution, we can improve
        mapping accuracy and efficiency for precision agriculture applications.</summary>\n
        \   <category term=\"cs.RO\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <category term=\"cs.AI\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <published>2025-03-10T11:50:15Z</published>\n    <arxiv:primary_category
        term=\"cs.RO\"/>\n    <author>\n      <name>Jacob Swindell</name>\n    </author>\n
        \   <author>\n      <name>Madeleine Darbyshire</name>\n    </author>\n    <author>\n
        \     <name>Marija Popovic</name>\n    </author>\n    <author>\n      <name>Riccardo
        Polvara</name>\n    </author>\n  </entry>\n  <entry>\n    <id>http://arxiv.org/abs/2604.23442v1</id>\n
        \   <title>Resource-Constrained UAV-Based Weed Detection for Site-Specific
        Management on Edge Devices</title>\n    <updated>2026-04-25T20:58:51Z</updated>\n
        \   <link href=\"https://arxiv.org/abs/2604.23442v1\" rel=\"alternate\" type=\"text/html\"/>\n
        \   <link href=\"https://arxiv.org/pdf/2604.23442v1\" rel=\"related\" type=\"application/pdf\"
        title=\"pdf\"/>\n    <summary>Weeds compete with crops for light, water, and
        nutrients, reducing yield and crop quality. Efficient weed detection is essential
        for site-specific weed management (SSWM). Although deep learning models have
        been deployed on UAV-based edge systems, a systematic understanding of how
        different model architectures perform under real-world resource constraints
        is still lacking. To address this gap, this study proposes a deployment-oriented
        framework for real-time UAV-based weed detection on resource-constrained edge
        platforms. The framework integrates UAV data acquisition, model development,
        and on-device inference, with a focus on balancing detection accuracy and
        computational efficiency. A diverse set of state-of-the-art object detection
        models is evaluated, including convolution-based YOLO models (v8-v12) and
        transformer-based RT-DETR models (v1-v2). Experiments on three edge devices
        (Jetson Orin Nano, Jetson AGX Xavier, and Jetson AGX Orin) demonstrate clear
        trade-offs between accuracy and inference latency across models and hardware
        configurations. Results show that high-capacity models achieve up to 86.9%
        mAP50 but suffer from high latency, limiting real-time deployment. In contrast,
        lightweight models achieve 66%-71% mAP50 with significantly lower latency,
        enabling real-time performance. Among all models, RT-DETRv2-R50-M achieves
        competitive accuracy (79% mAP50) with improved efficiency, while YOLOv10n
        provides the fastest inference speed. YOLOv11s and RT-DETRv2-R50-M offer the
        best balance between accuracy and speed, making them strong candidates for
        real-time UAV deployment.</summary>\n    <category term=\"cs.CV\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <published>2026-04-25T20:58:51Z</published>\n    <arxiv:primary_category
        term=\"cs.CV\"/>\n    <author>\n      <name>Linyuan Wang</name>\n    </author>\n
        \   <author>\n      <name>Haibo Yao</name>\n    </author>\n    <author>\n
        \     <name>Te-Ming Tseng</name>\n    </author>\n    <author>\n      <name>Kelvin
        Betitame</name>\n    </author>\n    <author>\n      <name>Xin Sun</name>\n
        \   </author>\n    <author>\n      <name>Hanbo Huang</name>\n    </author>\n
        \   <author>\n      <name>Dong Chen</name>\n    </author>\n  </entry>\n  <entry>\n
        \   <id>http://arxiv.org/abs/2006.16866v1</id>\n    <title>Rapid Response
        Crop Maps in Data Sparse Regions</title>\n    <updated>2020-06-23T17:19:26Z</updated>\n
        \   <link href=\"https://arxiv.org/abs/2006.16866v1\" rel=\"alternate\" type=\"text/html\"/>\n
        \   <link href=\"https://arxiv.org/pdf/2006.16866v1\" rel=\"related\" type=\"application/pdf\"
        title=\"pdf\"/>\n    <summary>Spatial information on cropland distribution,
        often called cropland or crop maps, are critical inputs for a wide range of
        agriculture and food security analyses and decisions. However, high-resolution
        cropland maps are not readily available for most countries, especially in
        regions dominated by smallholder farming (e.g., sub-Saharan Africa). These
        maps are especially critical in times of crisis when decision makers need
        to rapidly design and enact agriculture-related policies and mitigation strategies,
        including providing humanitarian assistance, dispersing targeted aid, or boosting
        productivity for farmers. A major challenge for developing crop maps is that
        many regions do not have readily accessible ground truth data on croplands
        necessary for training and validating predictive models, and field campaigns
        are not feasible for collecting labels for rapid response. We present a method
        for rapid mapping of croplands in regions where little to no ground data is
        available. We present results for this method in Togo, where we delivered
        a high-resolution (10 m) cropland map in under 10 days to facilitate rapid
        response to the COVID-19 pandemic by the Togolese government. This demonstrated
        a successful transition of machine learning applications research to operational
        rapid response in a real humanitarian crisis. All maps, data, and code are
        publicly available to enable future research and operational systems in data-sparse
        regions.</summary>\n    <category term=\"cs.CV\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <category term=\"cs.LG\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <category term=\"eess.IV\" scheme=\"http://arxiv.org/schemas/atom\"/>\n
        \   <published>2020-06-23T17:19:26Z</published>\n    <arxiv:comment>Presented
        at KDD 2020 Humanitarian Mapping Workshop</arxiv:comment>\n    <arxiv:primary_category
        term=\"cs.CV\"/>\n    <author>\n      <name>Hannah Kerner</name>\n    </author>\n
        \   <author>\n      <name>Gabriel Tseng</name>\n    </author>\n    <author>\n
        \     <name>Inbal Becker-Reshef</name>\n    </author>\n    <author>\n      <name>Catherine
        Nakalembe</name>\n    </author>\n    <author>\n      <name>Brian Barker</name>\n
        \   </author>\n    <author>\n      <name>Blake Munshell</name>\n    </author>\n
        \   <author>\n      <name>Madhava Paliyam</name>\n    </author>\n    <author>\n
        \     <name>Mehdi Hosseini</name>\n    </author>\n  </entry>\n  <entry>\n
        \   <id>http://arxiv.org/abs/2602.23677v1</id>\n    <title>Vision-Language
        Semantic Grounding for Multi-Domain Crop-Weed Segmentation</title>\n    <updated>2026-02-27T04:53:18Z</updated>\n
        \   <link href=\"https://arxiv.org/abs/2602.23677v1\" rel=\"alternate\" type=\"text/html\"/>\n
        \   <link href=\"https://arxiv.org/pdf/2602.23677v1\" rel=\"related\" type=\"application/pdf\"
        title=\"pdf\"/>\n    <summary>Fine-grained crop-weed segmentation is essential
        for enabling targeted herbicide application in precision agriculture. However,
        existing deep learning models struggle to generalize across heterogeneous
        agricultural environments due to reliance on dataset-specific visual features.
        We propose Vision-Language Weed Segmentation (VL-WS), a novel framework that
        addresses this limitation by grounding pixel-level segmentation in semantically
        aligned, domain-invariant representations. Our architecture employs a dual-encoder
        design, where frozen Contrastive Language-Image Pretraining (CLIP) embeddings
        and task-specific spatial features are fused and modulated via Feature-wise
        Linear Modulation (FiLM) layers conditioned on natural language captions.
        This design enables image level textual descriptions to guide channel-wise
        feature refinement while preserving fine-grained spatial localization. Unlike
        prior works restricted to training and evaluation on single-source datasets,
        VL-WS is trained on a unified corpus that includes close-range ground imagery
        (robotic platforms) and high-altitude UAV imagery, covering diverse crop types,
        weed species, growth stages, and sensing conditions. Experimental results
        across four benchmark datasets demonstrate the effectiveness of our framework,
        with VL-WS achieving a mean Dice score of 91.64% and outperforming the CNN
        baseline by 4.98%. The largest gains occur on the most challenging weed class,
        where VL-WS attains 80.45% Dice score compared to 65.03% for the best baseline,
        representing a 15.42% improvement. VL-WS further maintains stable weed segmentation
        performance under limited target-domain supervision, indicating improved generalization
        and data efficiency. These findings highlight the potential of vision-language
        alignment to enable scalable, label-efficient segmentation models deployable
        across diverse real-world agricultural domains.</summary>\n    <category term=\"cs.CV\"
        scheme=\"http://arxiv.org/schemas/atom\"/>\n    <published>2026-02-27T04:53:18Z</published>\n
        \   <arxiv:primary_category term=\"cs.CV\"/>\n    <author>\n      <name>Nazia
        Hossain</name>\n    </author>\n    <author>\n      <name>Xintong Jiang</name>\n
        \   </author>\n    <author>\n      <name>Yu Tian</name>\n    </author>\n    <author>\n
        \     <name>Philippe Seguin</name>\n    </author>\n    <author>\n      <name>O.
        Grant Clark</name>\n    </author>\n    <author>\n      <name>Shangpeng Sun</name>\n
        \   </author>\n  </entry>\n  <entry>\n    <id>http://arxiv.org/abs/2604.14837v1</id>\n
        \   <title>Improved Multiscale Structural Mapping with Supervertex Vision
        Transformer for the Detection of Alzheimer's Disease Neurodegeneration</title>\n
        \   <updated>2026-04-16T10:15:22Z</updated>\n    <link href=\"https://arxiv.org/abs/2604.14837v1\"
        rel=\"alternate\" type=\"text/html\"/>\n    <link href=\"https://arxiv.org/pdf/2604.14837v1\"
        rel=\"related\" type=\"application/pdf\" title=\"pdf\"/>\n    <summary>Alzheimer's
        disease (AD) confirmation often relies on positron emission tomography (PET)
        or cerebrospinal fluid (CSF) analysis, which are costly and invasive. Consequently,
        structural MRI biomarkers such as cortical thickness (CT) are widely used
        for non-invasive AD screening. Multiscale structural mapping (MSSM) was recently
        proposed to integrate gray-white matter contrasts (GWCs) with CT from a single
        T1-weighted MRI (T1w) scan. Building on this framework, we propose MSSM+,
        together with surface supervertex mapping (SSVM) and a Supervertex Vision
        Transformer (SV-ViT). 3D T1w images from individuals with AD and cognitively
        normal (CN) controls were analyzed. MSSM+ extends MSSM by incorporating sulcal
        depth and cortical curvature at the vertex level. SSVM partitions the cortical
        surface into supervertices (surface patches) that effectively represent inter-
        and intra-regional spatial relationships. SV-ViT is a Vision Transformer architecture
        operating on these supervertices, enabling anatomically informed learning
        from surface mesh representations. Compared with MSSM, MSSM+ identified more
        spatially extensive and statistically significant group differences between
        AD and CN. In AD vs. CN classification, MSSM+ achieved a 3%p higher area under
        the precision-recall curve than MSSM. Vendor-specific analyses further demonstrated
        reduced signal variability and consistently improved classification performance
        across MR manufacturers relative to CT, GWCs, and MSSM. These findings suggest
        that MSSM+ combined with SV-ViT is a promising MRI-based imaging marker for
        AD detection prior to CSF/PET confirmation.</summary>\n    <category term=\"cs.CV\"
        scheme=\"http://arxiv.org/schemas/atom\"/>\n    <published>2026-04-16T10:15:22Z</published>\n
        \   <arxiv:comment>Submitted to Human Brain Mapping</arxiv:comment>\n    <arxiv:primary_category
        term=\"cs.CV\"/>\n    <arxiv:journal_ref>Human Brain Mapping 47(8), e70548
        (2026)</arxiv:journal_ref>\n    <author>\n      <name>Geonwoo Baek</name>\n
        \   </author>\n    <author>\n      <name>David H. Salat</name>\n    </author>\n
        \   <author>\n      <name>Ikbeom Jang</name>\n    </author>\n    <arxiv:doi>10.1002/hbm.70548</arxiv:doi>\n
        \   <link rel=\"related\" href=\"https://doi.org/10.1002/hbm.70548\" title=\"doi\"/>\n
        \ </entry>\n</feed>\n"
