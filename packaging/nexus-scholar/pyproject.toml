[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-scholar"
version = "1.0.0"
description = "Single umbrella package: the Nexus Scholar harness CLI and the eight scholar-* kit packages behind one uvx command."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

authors = [
    { name = "Nexus Scholar Org", email = "nexus-scholar@users.noreply.github.com" },
]

keywords = [
    "systematic review",
    "PRISMA",
    "literature review",
    "MCP",
    "evidence synthesis",
    "scientific literature",
    "RAG",
    "meta-analysis",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Scientific/Engineering :: Interface Engine/Protocol Translator",
]

# Light, pragmatic runtime set for the smoke paths (``nexus-scholar --help`` /
# ``scholar-agent --help``).  Heavy deps (chromadb, torch, sentence-transformers)
# are deliberately deferred to P7.7 (lazy imports) to keep the wheel install fast.
dependencies = [
    "aiohttp>=3.9.0",
    "bibtexparser>=2.0.0",
    "fastapi>=0.115.0",
    "hishel==0.0.32",
    "httpx>=0.28.1",
    "mcp>=1.0.0",
    "networkx>=3.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # Import-time reachability: the vendored E1 pdf-kit imports ``pypdf.errors``
    # at package import (``scholar_pdf/__init__`` -> ``.acquisition`` -> ``pypdf``),
    # and this metapackage force-includes kit *sources* rather than depending on
    # kit wheels, so it must declare pypdf for the P7.7/CI minimal-dep wheel
    # smoke (``--help``).  pypdf is lightweight pure Python; the heavy deps
    # (pymupdf, chromadb, torch) stay lazy/deferred and are not imported here.
    "pypdf>=4.0.0",
    "pyvis>=0.3.0",
    # E2-014 mirror: the E2 pdf-kit declares ``pyyaml>=6.0.0`` and its extraction
    # / frontmatter modules parse and render YAML frontmatter.  Those imports are
    # function-local (``extract.extract_markdown``, ``frontmatter.render_frontmatter``),
    # so unlike pypdf this is a runtime dep rather than an import-time one.
    "pyyaml>=6.0.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "tenacity>=8.0.0",
    "typer>=0.9.0",
    "uvicorn>=0.30.0",
]

[project.urls]
Repository = "https://github.com/nexus-scholar-org/nexus-scholar-harness"
Releases = "https://github.com/nexus-scholar-org/nexus-scholar-harness/releases"
Documentation = "https://github.com/nexus-scholar-org/nexus-scholar-harness/blob/main/docs/nexus_scholar_user_guide.md"
Homepage = "https://github.com/nexus-scholar-org/nexus-scholar-harness"

[project.scripts]
nexus-scholar = "scholar_harness.cli:app"
scholar-agent = "scholar_agent.server:main"

# Sources are bundled into the wheel at top level from the monorepo layout:
# the harness package (../../src) and the eight kit packages (../../tools/*/src).
# Nothing is copied into this directory at author time.
[tool.hatch.build.targets.wheel]
packages = []

[tool.hatch.build.targets.wheel.force-include]
"../../src/scholar_harness" = "scholar_harness"
"../../tools/scholar-protocol-kit/src/scholar_protocol" = "scholar_protocol"
"../../tools/scholar-search-kit/src/scholar_search" = "scholar_search"
"../../tools/scholar-pdf-kit/src/scholar_pdf" = "scholar_pdf"
"../../tools/scholar-bib-kit/src/scholar_bib" = "scholar_bib"
"../../tools/scholar-rag-kit/src/scholar_rag" = "scholar_rag"
"../../tools/scholar-graph-kit/src/scholar_graph" = "scholar_graph"
"../../tools/scholar-agent-kit/src/scholar_agent" = "scholar_agent"
"../../tools/scholar-verify-kit/src/scholar_verify" = "scholar_verify"
# Whole-tree skills bundle — dev-only pull-request-gate EXCLUDED (spec 03 §9:
# the contribution workflow must never ship in a customer-facing package).
"../../.agents/skills/critic-contract" = "scholar_harness_data/skills/critic-contract"
"../../.agents/skills/doer-contract" = "scholar_harness_data/skills/doer-contract"
"../../.agents/skills/inception-agent" = "scholar_harness_data/skills/inception-agent"
"../../.agents/skills/methodology-copilot" = "scholar_harness_data/skills/methodology-copilot"
"../../.agents/skills/scholar-agent-kit" = "scholar_harness_data/skills/scholar-agent-kit"
"../../.agents/skills/scholar-bib-kit" = "scholar_harness_data/skills/scholar-bib-kit"
"../../.agents/skills/scholar-graph-kit" = "scholar_harness_data/skills/scholar-graph-kit"
"../../.agents/skills/scholar-pdf-kit" = "scholar_harness_data/skills/scholar-pdf-kit"
"../../.agents/skills/scholar-protocol-kit" = "scholar_harness_data/skills/scholar-protocol-kit"
"../../.agents/skills/scholar-rag-kit" = "scholar_harness_data/skills/scholar-rag-kit"
"../../.agents/skills/scholar-search-kit" = "scholar_harness_data/skills/scholar-search-kit"
"../../.agents/skills/scholar-verify-kit" = "scholar_harness_data/skills/scholar-verify-kit"
"../../.agents/skills/workspace-manager" = "scholar_harness_data/skills/workspace-manager"
# Spec 03 §6 fix #1 (preferred): force-include the referenced doc so the
# three skill pointers resolve where the skill ships.
"../../docs/kits_surface_matrix.md" = "scholar_harness_data/docs/kits_surface_matrix.md"
"nexus_scholar_pins.json" = "nexus_scholar_pins.json"
