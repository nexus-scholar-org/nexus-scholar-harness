<svg xmlns="http://www.w3.org/2000/svg" width="720" height="760" viewBox="0 0 720 760" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <title>PRISMA-ScR flow of information — AI research harnesses and trust review (D3), Version 1.0</title>

  <!-- IDENTIFICATION group -->
  <rect x="30" y="20" width="660" height="180" fill="#eef4fb" stroke="#c5d5ea"/>
  <text x="45" y="40" font-weight="bold">Identification</text>

  <rect x="60" y="60" width="300" height="110" fill="#ffffff" stroke="#333"/>
  <text x="70" y="82" font-weight="bold">Records identified from 5 sources</text>
  <text x="70" y="102">(OpenAlex, Semantic Scholar, Crossref,</text>
  <text x="70" y="120">PubMed, arXiv; bioRxiv-track via indexing)</text>
  <text x="70" y="146" font-weight="bold" fill="#1a5276">n = 250  (50 per provider, query Q001)</text>
  <text x="70" y="164" fill="#555">literature/raw_search.json</text>

  <rect x="400" y="60" width="260" height="110" fill="#ffffff" stroke="#333"/>
  <text x="410" y="82" font-weight="bold">Records removed before screening</text>
  <text x="410" y="102">Duplicate/DOI + normalized-title dedup</text>
  <text x="410" y="146" font-weight="bold" fill="#922B21">n = 11</text>
  <text x="410" y="164" fill="#555">literature/deduped.json</text>

  <!-- SCREENING group -->
  <rect x="30" y="210" width="660" height="200" fill="#effaf1" stroke="#b8dcc4"/>
  <text x="45" y="230" font-weight="bold">Screening</text>

  <rect x="200" y="250" width="320" height="70" fill="#ffffff" stroke="#333"/>
  <text x="210" y="272" font-weight="bold">Records screened (4 AI screeners, 12 batches)</text>
  <text x="210" y="296" font-weight="bold" fill="#1a5276">n = 239</text>

  <rect x="200" y="335" width="320" height="60" fill="#ffffff" stroke="#333"/>
  <text x="210" y="357" font-weight="bold">Records excluded at title/abstract</text>
  <text x="210" y="377" font-weight="bold" fill="#922B21">n = 181</text>

  <!-- ELIGIBILITY -->
  <rect x="30" y="420" width="660" height="150" fill="#fdedec" stroke="#e4b9b6"/>
  <text x="45" y="440" font-weight="bold">Eligibility (trust verification)</text>

  <rect x="60" y="460" width="280" height="95" fill="#ffffff" stroke="#333"/>
  <text x="70" y="482" font-weight="bold">OA full-text harvested &amp; validated</text>
  <text x="70" y="504">64 PDFs; 57 included studies contribute claims</text>
  <text x="70" y="524">(1 empty abstract, claim-void)</text>
  <text x="70" y="542" font-weight="bold" fill="#1a5276">n = 64</text>

  <rect x="390" y="460" width="270" height="95" fill="#ffffff" stroke="#333"/>
  <text x="400" y="482" font-weight="bold">Phase-4 trust streams (4)</text>
  <text x="400" y="504">retraction 48 checked (0 flagged);</text>
  <text x="400" y="522">COI 47 scanned; open-science 32 statements;</text>
  <text x="400" y="540">risk-of-bias attestation</text>

  <!-- INCLUDED -->
  <rect x="30" y="580" width="660" height="150" fill="#f4f6f7" stroke="#c5d5ea"/>
  <text x="45" y="600" font-weight="bold">Included</text>

  <rect x="180" y="620" width="360" height="95" fill="#ffffff" stroke="#1a5276" stroke-width="2"/>
  <text x="190" y="642" font-weight="bold" fill="#1a5276">Studies included in living Review 1.0</text>
  <text x="190" y="664" font-weight="bold" fill="#1a5276">n = 58 included / 181 excluded</text>
  <text x="190" y="686">510 claims (166 RQ1 / 132 RQ2 / 212 RQ3);</text>
  <text x="190" y="704">95 consensus clusters; 47 fully Phase-4 certified</text>
</svg>