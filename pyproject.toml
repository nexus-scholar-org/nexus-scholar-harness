[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-scholar-harness"
version = "1.0.0"
description = "Harness for systematic literature reviews: skills, plugin registry, and unified tool environment."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# The harness itself is a thin orchestrator. The scholar-* kits are NOT vendored here;
# they live in their own repositories and are installed into the shared .venv by
# scripts/install_plugins.py (which reads .agents/plugins/nexus-scholar/plugins.json).
# This keeps one source of truth for each kit and one shared environment for the harness.
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    # tests/unit/test_http_client.py declares 8 `async def` tests marked
    # `@pytest.mark.asyncio` (the search kit's http retry/backoff suite). The
    # plugin used to arrive only transitively through the kits' own dev extras
    # (scripts/install_plugins.py), so a clean `uv sync --extra dev` env could
    # not run those tests at all -- they failed with "async def functions are
    # not natively supported". The harness declares the tests, so the harness
    # must declare the plugin that runs them. Dev extra ONLY: it must never
    # enter the metapackage wheel's runtime deps (the minimal-dependency
    # packaging contract is CI-hard-gated by the wheel-smoke job).
    "pytest-asyncio>=0.21.0",
    "ruff>=0.4.0",
    # starlette's TestClient -- used by the console API tests under
    # tests/console/ -- requires httpx2. Without it declared here the console
    # test suite only runs in a venv that happens to have httpx2 already
    # (it arrives transitively through the agent kit's mcp dependency), so a
    # clean `uv sync --extra dev` environment could not run them at all.
    "httpx2>=2.0.0",
]

[project.scripts]
scholar-harness = "scholar_harness.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    "src",
    "tools/scholar-protocol-kit/src",
    "tools/scholar-search-kit/src",
    "tools/scholar-pdf-kit/src",
    "tools/scholar-bib-kit/src",
    "tools/scholar-rag-kit/src",
    "tools/scholar-graph-kit/src",
    "tools/scholar-agent-kit/src",
]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/scholar_harness"]
