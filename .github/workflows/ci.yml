name: Nexus Scholar CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# One repository, one package (`nexus-scholar`): the harness and the eight
# scholar_* packages live under src/, their tests under tests/ (kit tests in
# tests/kits/<kit>/). There are no per-kit installs, pins or sync steps.

jobs:
  build-wheel:
    # Single build; the wheel is pure Python (py3-none-any), carries the app's
    # static export, and feeds every job below through the shared artifact.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "0.12.5"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/research-ui/package-lock.json

      - name: Build the app's static export
        # The wheel carries it as scholar_harness_data/ui (hatch_build.py);
        # NEXUS_WHEEL_REQUIRE_UI makes a missing export a build error.
        working-directory: apps/research-ui
        run: |
          npm ci
          npm run build:export

      - name: Build the nexus-scholar wheel
        env:
          NEXUS_WHEEL_REQUIRE_UI: "1"
        run: uv build --wheel

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-scholar-wheel
          path: dist/*.whl
          if-no-files-found: error

  lint-and-smoke:
    needs: build-wheel
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "0.12.5"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync project environment
        run: uv sync --extra dev

      - name: Lint with ruff
        run: uv run ruff check scripts/

      # M6-beta (review T-P1-3): real-bug classes only on src/ (undefined and
      # redefined names, loop-variable capture, mutable defaults, syntax).
      # Style findings (unused imports, F541) stay out of the gate on purpose.
      - name: Lint src/ for real bugs
        run: uv run ruff check src/ --select F821,F811,F823,F632,F7,B023,B006,E9

      - name: Verify plugin manifest
        run: uv run python scripts/validate_manifest.py

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: nexus-scholar-wheel
          path: dist

      - name: Smoke the wheel on a minimal-dependency env
        # Both entrypoints must answer --help without the heavy optional
        # backends; a chromadb or torch import here is a packaging regression.
        shell: bash
        run: |
          set -euo pipefail
          wheel=$(ls dist/nexus_scholar-*-py3-none-any.whl)
          uvx --from "$wheel" nexus-scholar --help > /dev/null
          uvx --from "$wheel" scholar-agent --help > /dev/null
          uvx --from "$wheel" python -c "import scholar_rag.index_service as s, scholar_harness.index_acceptance as a; assert s.INDEX_SERVICE_OUTCOMES==frozenset({'SUCCESS','PARTIAL','REFUSED','FAILED'}); assert a.ACCEPTANCE_SCHEMA_VERSION=='index-acceptance-v1'; import importlib.util as u; assert u.find_spec('chromadb') is None, 'chromadb leaked into the base install'; assert u.find_spec('torch') is None, 'torch leaked into the base install'"
          echo "wheel smoke OK"

      - name: Workspace-manager CLI smoke
        run: uv run python .agents/skills/workspace-manager/scripts/log_event.py --help

  python-test:
    # The whole suite (harness + every kit's tests) in one run, on one
    # representative runner, with the pdf and rag extras installed so nothing
    # is deselected. Cross-OS coverage comes from lint-and-smoke and wheel-e2e.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "0.12.5"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync project environment (dev + pdf + rag extras)
        run: uv sync --extra dev --extra pdf --extra rag

      - name: Contract v1 drift gates not covered by pytest
        run: |
          uv run --no-sync python scripts/generate_contract_schemas.py --check
          uv run --no-sync python scripts/generate_two_study_contract_fixture.py --check
          uv run --no-sync python scripts/generate_protocol_schema.py --check

      - name: Test suite
        run: uv run --no-sync pytest -q -o addopts=""

  wheel-e2e:
    # The uvx flow end to end from the wheel, in a temp folder with no repo
    # tree reachable. Git Bash on windows keeps one portable script.
    needs: build-wheel
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "0.12.5"

      - name: Download wheel artifact
        uses: actions/download-artifact@v4
        with:
          name: nexus-scholar-wheel
          path: dist

      - name: uvx flow end-to-end in a fresh temp folder
        shell: bash
        run: |
          set -euo pipefail

          if command -v cygpath >/dev/null 2>&1; then
            ws="$RUNNER_TEMP/nexus-e2e-ws"
            ws_norm="$(cygpath -u "$ws")"
            runner_temp_norm="$(cygpath -u "$RUNNER_TEMP")"
            workspace_norm="$(cygpath -u "$GITHUB_WORKSPACE")"
          else
            ws="$RUNNER_TEMP/nexus-e2e-ws"
            ws_norm="$ws"
            runner_temp_norm="$RUNNER_TEMP"
            workspace_norm="$GITHUB_WORKSPACE"
          fi

          wheel="$(ls "$GITHUB_WORKSPACE"/dist/nexus_scholar-*-py3-none-any.whl)"

          rm -rf "$ws"
          mkdir -p "$ws"

          echo "--- [1/5] init --scaffold-only ---"
          uvx --from "$wheel" nexus-scholar init "CI E2E Project" --dir "$ws" --scaffold-only

          echo "--- [2/5] setup-mcp --dry-run ---"
          uvx --from "$wheel" nexus-scholar setup-mcp --workspace "$ws" --harness mcp --dry-run

          echo "--- [3/5] doctor --exit-code ---"
          uvx --from "$wheel" nexus-scholar doctor --workspace "$ws" --exit-code

          echo "--- [4/5] log event CI_PROBE ---"
          uvx --from "$wheel" nexus-scholar log event "$ws" --action CI_PROBE --agent ci --description "CI gate"
          test -f "$ws/audit/journal.jsonl" || { echo "::error::audit/journal.jsonl missing"; exit 1; }
          grep -q '"action": *"CI_PROBE"' "$ws/audit/journal.jsonl" || { echo "::error::journal.jsonl lacks CI_PROBE"; exit 1; }
          test -f "$ws/project.json" || { echo "::error::project.json missing"; exit 1; }
          test -f "$ws/INDEX.md" || { echo "::error::INDEX.md missing"; exit 1; }

          echo "--- [5/5] log sync-index ---"
          uvx --from "$wheel" nexus-scholar log sync-index "$ws"
          test -f "$ws/INDEX.md" || { echo "::error::INDEX.md missing after sync-index"; exit 1; }

          case "$ws_norm" in
            "$runner_temp_norm"/*) : ;;
            *) echo "::error::workspace not under RUNNER_TEMP: $ws_norm"; exit 1 ;;
          esac
          case "$ws_norm" in
            "$workspace_norm"/*) echo "::error::workspace created inside the git checkout: $ws_norm"; exit 1 ;;
            *) : ;;
          esac
          echo "uvx flow e2e OK"

      - name: nexus-scholar ui from the wheel serves the app and its engine
        # M5-slim: one process, one origin; a one-time launch link sets the
        # session; the app's pages and the workspaces API answer.
        shell: bash
        run: |
          set -euo pipefail
          wheel="$(ls "$GITHUB_WORKSPACE"/dist/nexus_scholar-*-py3-none-any.whl)"
          root="$RUNNER_TEMP/nexus-ui-root"
          log="$RUNNER_TEMP/nexus-ui.log"
          uvx --from "$wheel" nexus-scholar ui --root "$root" --port 8799 --no-browser > "$log" 2>&1 &
          pid=$!
          for i in $(seq 1 120); do curl -sf -o /dev/null http://127.0.0.1:8799/healthz && break; sleep 1; done
          link="$(grep -o 'http://127.0.0.1:8799/launch?[^ ]*' "$log" | tr -d '\r' | head -1)"
          test -n "$link" || { cat "$log"; echo "::error::no launch link printed"; exit 1; }
          jar="$RUNNER_TEMP/jar"
          test "$(curl -s -c "$jar" -o /dev/null -w '%{http_code}' "$link")" = "303"
          test "$(curl -s -b "$jar" -o /dev/null -w '%{http_code}' http://127.0.0.1:8799/en/screening/home/)" = "200"
          curl -sf -b "$jar" http://127.0.0.1:8799/api/console/api/v1/workspaces | grep -q '"root_source":"flag"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8799/api/console/api/v1/workspaces)" = "401"
          kill "$pid" || true
          echo "nexus-scholar ui smoke OK"

  research-ui:
    # The vitest suite includes live-console tests that spawn
    # `uv run scholar-harness serve`, so it needs the Python environment too.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "0.12.5"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync project environment
        run: uv sync --extra dev

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/research-ui/package-lock.json

      - name: Install app dependencies
        working-directory: apps/research-ui
        run: npm ci

      - name: Typecheck
        working-directory: apps/research-ui
        run: npm run typecheck

      - name: Vitest suite
        working-directory: apps/research-ui
        run: npm run test

      - name: Production build
        working-directory: apps/research-ui
        run: npm run build

  research-ui-browser:
    # Pure Node: the browser suite fulfils the console at the network boundary.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/research-ui/package-lock.json

      - name: Install app dependencies
        working-directory: apps/research-ui
        run: npm ci

      - name: Install Chromium for Playwright
        working-directory: apps/research-ui
        run: npx playwright install --with-deps chromium

      - name: Playwright browser suite
        working-directory: apps/research-ui
        run: npm run test:browser
