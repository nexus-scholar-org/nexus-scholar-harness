name: Nexus Scholar Harness CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "0.12.5"
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync project environment
        run: uv sync --extra dev
      
      - name: Lint with ruff
        run: uv run ruff check scripts/
      
      - name: Test plugin installer (syntax & help)
        run: uv run python scripts/install_plugins.py --help
      
      - name: Verify plugin manifest
        run: uv run python scripts/validate_manifest.py

      - name: Enforce nexus-scholar pins freshness
        run: uv run python scripts/generate_nexus_scholar_pins.py --check

      - name: Build nexus-scholar metapackage wheel
        run: uv build --wheel packaging/nexus-scholar

      - name: Smoke nexus-scholar metapackage wheel (best-effort)
        # The chromadb trace is the documented P7.7-deferred gap (lazy-imports);
        # anything else that fails the smoke (missing entrypoint, absent
        # force-include package, ...) is an unexpected packaging regression and
        # marks this step red even with continue-on-error.
        shell: bash
        run: |
          P7_7_GAP="ModuleNotFoundError: No module named 'chromadb'"
          smoke() {
            local entrypoint="$1"
            if uvx --from packaging/nexus-scholar/dist/nexus_scholar-1.0.0-py3-none-any.whl "$entrypoint" --help > smoke.log 2>&1; then
              echo "$entrypoint smoke OK"
              return 0
            fi
            if grep -q "$P7_7_GAP" smoke.log; then
              echo "$entrypoint smoke hit the documented P7.7-deferred chromadb gap; continuing"
              return 0
            fi
            echo "::error::$entrypoint smoke FAILED with an unexpected error (packaging regression?)"
            cat smoke.log
            return 1
          }
          status=0
          smoke "nexus-scholar" || status=1
          smoke "scholar-agent" || status=1
          exit $status
        continue-on-error: true
      
      - name: Install plugins (git-only, no local checkouts)
        run: uv run python scripts/install_plugins.py --git-only --no-verify
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
      
      - name: Test workspace-manager smoke test
        run: |
          uv run python .agents/skills/workspace-manager/scripts/log_event.py \
            --help || echo "Workspace-manager CLI not yet available"
        continue-on-error: true

  schema-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install uv
        uses: astral-sh/setup-uv@v2
      
      - name: Validate plugin manifest JSON schema
        run: |
          python -c "
          import json
          from jsonschema import validate
          
          with open('.agents/plugins/nexus-scholar/plugins.json') as f:
              manifest = json.load(f)
          
          # Basic schema validation
          required_fields = {'name', 'repo', 'default_rev', 'console_script'}
          for plugin in manifest.get('plugins', []):
              assert isinstance(plugin, dict), f'Plugin must be dict: {plugin}'
              assert required_fields.issubset(plugin.keys()), f'Missing fields in {plugin.get(\"name\")}'
              print(f'✅ {plugin[\"name\"]}: valid')
          "
