name: nexus-scholar GitHub Release

# P7.8: publish the source-bundling metapackage wheel as a GitHub Release on a
# v* tag.  Uses only gh (preinstalled on runners) + built-in actions; the tag is
# the release handle, and it must equal v<project version> (M6-beta).
#
# Triggers:
#   - push of a v* tag -> real release
#   - manual workflow_dispatch -> smoke the release path on demand (defaults to
#     the checked-out ref so no tag is required)
#
# The gh release-view guard makes re-runs idempotent: if a release already
# exists for the computed tag, the job exits 0 without touching anything.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "0.12.5"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/research-ui/package-lock.json

      - name: Read the project version and check the tag
        # M6-beta: the version lives in pyproject.toml only. A tag push must name
        # exactly that version (v$VERSION), or nothing is built or published.
        shell: bash
        run: |
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the project version v$VERSION"
            exit 1
          fi

      - name: Build the app's static export
        # The wheel carries it as scholar_harness_data/ui (hatch_build.py);
        # NEXUS_WHEEL_REQUIRE_UI makes a missing export a build error.
        working-directory: apps/research-ui
        run: |
          npm ci
          npm run build:export

      - name: Build the nexus-scholar wheel
        # The root package since the 2026-11-03 kit merge; it carries the app.
        env:
          NEXUS_WHEEL_REQUIRE_UI: "1"
        run: uv build --wheel

      - name: Build the Claude Desktop Extension (.mcpb)
        # M5-slim: scholar-agent for the researcher's own Claude, carrying the wheel.
        run: uv run --no-project python scripts/build_mcpb.py --wheel "dist/nexus_scholar-${VERSION}-py3-none-any.whl"

      - name: Create GitHub Release for the wheel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          DIST_DIR="$GITHUB_WORKSPACE/dist"
          WHEEL="$DIST_DIR/nexus_scholar-${VERSION}-py3-none-any.whl"
          test -f "$WHEEL" || { echo "::error::wheel not found: $WHEEL"; exit 1; }
          MCPB="$DIST_DIR/nexus-scholar-${VERSION}.mcpb"
          test -f "$MCPB" || { echo "::error::extension not found: $MCPB"; exit 1; }

          # Tag handling: on a tag push use the pushed tag (ref_name); on a
          # manual run default to the checked-out commit so no tag is required.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="$(git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD)"
          fi
          TARGET_SHA="$GITHUB_SHA"

          echo "Tag: $TAG"
          echo "Target SHA: $TARGET_SHA"
          echo "Wheel: $WHEEL"

          # Idempotent guard: skip when the release already exists for this tag.
          if gh release view "$TAG" --json id >/dev/null 2>&1; then
            echo "release already exists: $TAG"
            exit 0
          fi

          # A tag push and a manual dispatch can race through the guard above;
          # fall back to re-checking so the loser stays green.
          # A version with a, b or rc in it is a pre-release on GitHub too.
          PRERELEASE=""
          case "$VERSION" in *a*|*b*|*rc*) PRERELEASE="--prerelease" ;; esac
          if gh release create "$TAG" "$WHEEL" "$MCPB" $PRERELEASE \
            --target "$TARGET_SHA" \
            --title "nexus-scholar $TAG" \
            --generate-notes; then
            echo "release created: $TAG"
          elif gh release view "$TAG" --json id >/dev/null 2>&1; then
            echo "release created by a concurrent run: $TAG"
          else
            echo "::error::gh release create failed and no release exists for $TAG"
            exit 1
          fi

          echo "P7.8 github release OK: nexus-scholar $TAG -> $WHEEL"