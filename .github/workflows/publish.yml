name: Publish to PyPI

# P7.9 groundwork: publish the nexus-scholar metapackage wheel to PyPI using
# Trusted Publishing (OIDC).  The GitHub release workflow (release.yml) owns
# gh release create; this workflow ONLY pushes the wheel to PyPI.
#
# IMPORTANT: PyPI Trusted Publishing must be configured for the `pypi`
# deployment environment before the first tag push:
#   - Publisher repository: nexus-scholar-org/nexus-scholar-harness
#   - Workflow name: publish.yml
#   - Environment: pypi
# Until that is set up, the `uv publish` step will fail loudly (intended).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: write

jobs:
  publish:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v2
        with:
          version: "0.12.5"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/research-ui/package-lock.json

      - name: Build the app's static export
        # The wheel carries it as scholar_harness_data/ui (hatch_build.py);
        # NEXUS_WHEEL_REQUIRE_UI makes a missing export a build error.
        working-directory: apps/research-ui
        run: |
          npm ci
          npm run build:export

      - name: Build the nexus-scholar wheel
        # The root package since the 2026-11-03 kit merge; it carries the app.
        env:
          NEXUS_WHEEL_REQUIRE_UI: "1"
        run: uv build --wheel

      - name: Publish to PyPI (Trusted Publishing / OIDC)
        run: uv publish dist/nexus_scholar-1.0.0-py3-none-any.whl
