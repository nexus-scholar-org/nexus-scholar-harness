[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scholar-verify-kit"
version = "0.1.0"
description = "Post-screening trust verification: retraction status, open-science artifacts, conflict-of-interest audit, and risk-of-bias scoring."
authors = [{ name = "Nexus Scholar Org" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
scholar-verify = "scholar_verify.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/scholar_verify"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]