name: scholar-search-kit CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.github/workflows/scholar-search-kit-ci.yml'
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    name: Test Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Install uv
      uses: astral-sh/setup-uv@v2
      with:
        version: "latest"

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        uv venv --python ${{ matrix.python-version }}
        uv pip install -e ".[dev]"

    # AC-7 (packet T-K0): the kit's own CI must run the kit suite.
    # `--no-sync` keeps the dev extra installed: a bare `uv run` re-syncs the
    # project environment and drops the dev-only packages (pytest-asyncio),
    # which made the previous invocation depend on uv's sync behaviour.
    - name: Run pytest
      run: |
        uv run --no-sync pytest tests -q
